<title>Paycheque Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone-shaped column, iOS grouped lists, big-number hero, bottom tab bar with a centre log button. */
:root{
  --bg:#F2F2F6; --card:#FFFFFF; --card2:#F7F7FA; --fg:#111217; --muted:#6C6F7A; --faint:#A3A6B0;
  --line:rgba(60,60,80,.13); --shadow:0 1px 2px rgba(20,20,40,.05),0 8px 24px rgba(20,20,40,.06);
  --pay:#0E9F6E; --pay-soft:rgba(14,159,110,.12);
  --red:#E5484D; --red-soft:rgba(229,72,77,.12);
  --bill:#EE8A1E; --sub:#7457E8; --debt:#E0464E; --ess:#3478F0; --save:#0FA0A6; --fun:#E44E8C; --hold:#9AA0AD;
  --bar:rgba(250,250,252,.82);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#16171B; --card2:#1E1F25; --fg:#F4F5F7; --muted:#9A9DA8; --faint:#6A6D77;
  --line:rgba(255,255,255,.09); --shadow:none;
  --pay:#2BD48F; --pay-soft:rgba(43,212,143,.14); --red:#FF5C61; --red-soft:rgba(255,92,97,.16);
  --bill:#FFA041; --sub:#9C86FF; --debt:#FF5C61; --ess:#5C97FF; --save:#2CC8CC; --fun:#FF6FA8; --hold:#6E7380;
  --bar:rgba(22,23,27,.82); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#16171B; --card2:#1E1F25; --fg:#F4F5F7; --muted:#9A9DA8; --faint:#6A6D77;
  --line:rgba(255,255,255,.09); --shadow:none;
  --pay:#2BD48F; --pay-soft:rgba(43,212,143,.14); --red:#FF5C61; --red-soft:rgba(255,92,97,.16);
  --bill:#FFA041; --sub:#9C86FF; --debt:#FF5C61; --ess:#5C97FF; --save:#2CC8CC; --fun:#FF6FA8; --hold:#6E7380;
  --bar:rgba(22,23,27,.82); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--ess);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-block:8px 120px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 2px 6px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-disp);font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--f-disp);font-size:20px;font-weight:700;letter-spacing:-.01em;margin:0}
h3{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center}
h3 button{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ess);font-weight:600}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.save-state{font-size:12px;color:var(--faint);min-height:16px;text-align:right}

/* Period nav */
.pnav{display:flex;align-items:center;gap:6px}
.pnav button{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pnav button:hover{background:var(--card)}
.pnav svg{width:18px;height:18px}

/* Hero */
.hero{padding:20px 18px 18px;position:relative;overflow:hidden}
.hero .label{font-size:14px;font-weight:600;color:var(--muted)}
.big{font-family:var(--f-disp);font-size:48px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 4px}
.big.neg{color:var(--red)}
.hero .sub{font-size:13px;color:var(--muted);max-width:46ch}
.meter{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--card2);margin:16px 0 10px;gap:2px}
.meter i{display:block;height:100%;min-width:0;transition:flex-basis .5s cubic-bezier(.2,.8,.2,1)}
.meter i.hatch{background-image:repeating-linear-gradient(135deg,var(--hold) 0 3px,transparent 3px 6px)!important;opacity:.8}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border-radius:12px;padding:12px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:18px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}

/* Fun guard */
.guard{display:flex;gap:14px;align-items:center;padding:14px 16px;margin-top:12px}
.guard .ring{width:54px;height:54px;flex:none}
.guard b{font-family:var(--f-disp);font-size:22px;letter-spacing:-.02em}
.guard p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* Lists */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative;width:100%;text-align:left;min-height:56px}
.item+.item::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.item.done .amt{color:var(--muted)}
.tile{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;transition:all .2s}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .25s cubic-bezier(.3,1.6,.5,1);color:#fff}
.check.on{background:var(--pay);border-color:var(--pay)}
.check.on svg{opacity:1;transform:none}
.check.over{border-color:var(--red)}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.02em}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--pay-soft);color:var(--pay)}
.tag.grey{background:var(--card2);color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* Buckets */
.bucket{padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.bucket+.bucket{border-top:1px solid var(--line)}
.bucket .name{font-weight:600}
.bucket .prog{grid-column:2/4;height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bucket .prog i{display:block;height:100%;border-radius:3px}
.bucket .meta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.nowrap{flex-wrap:nowrap}
.chip{padding:8px 13px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--fg);color:var(--bg)}
.chip .dot{width:7px;height:7px}

/* Calendar */
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:6px 2px 10px}
.cal-title{white-space:nowrap;font-family:var(--f-disp);font-size:clamp(24px,7vw,32px);font-weight:800;letter-spacing:-.02em}
.cal-title span{color:var(--red)}
.cal-ctrl{display:flex;gap:4px;align-items:center}
.cal-ctrl button{height:32px;min-width:32px;padding:0 10px;border-radius:16px;display:grid;place-items:center;color:var(--red);font-weight:600}
.cal-ctrl button:hover{background:var(--card)}
.cal-ctrl svg{width:20px;height:20px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:6px}
.wd span:first-child,.wd span:last-child{color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);touch-action:pan-y}
.day{border-top:1px solid var(--line);padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:62px;position:relative}
.day .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:500;font-variant-numeric:tabular-nums}
.day.we .n{color:var(--muted)}
.day.today .n{color:var(--red);font-weight:700}
.day.sel .n{background:var(--fg);color:var(--bg);font-weight:700}
.day.sel.today .n{background:var(--red);color:#fff}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .paytag{position:absolute;top:4px;right:2px;font-size:9px;font-weight:800;color:var(--pay);letter-spacing:.03em}
.day.inpd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pay-soft)}
.agenda-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
.agenda-h b{font-size:17px}
.ev{display:flex;gap:12px;align-items:center;padding:11px 14px;position:relative;min-height:54px;width:100%;text-align:left}
.ev+.ev::before{content:"";position:absolute;top:0;left:26px;right:0;border-top:1px solid var(--line)}
.ev .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ev .main{flex:1;min-width:0}
.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}

/* Insights */
.ins{padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.ins+.ins{border-top:1px solid var(--line)}
.ins .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ins .ic svg{width:17px;height:17px}
.ins b{display:block;font-size:15px}
.ins p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.ins .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;background:var(--card2)}
.btn.primary{background:var(--fg);color:var(--bg)}
.btn.green{background:var(--pay);color:#fff}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.wide{width:100%;padding:14px}
.btn[disabled]{opacity:.5;cursor:default}
.ai-out{font-size:15px;line-height:1.55;margin-top:12px}
.ai-out p{margin:0 0 8px} .ai-out ul{margin:0 0 8px;padding-left:20px} .ai-out li{margin:2px 0}
.ai-out:empty{display:none}
.think{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:14px}
.think i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.claude-card{padding:16px;background:linear-gradient(180deg,var(--card),var(--card));border:1px solid var(--line)}
textarea.box{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--card2);padding:12px;resize:vertical;font-size:14px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--fg)}
.fab{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--pay);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(14,159,110,.35);transform:translateY(-10px);transition:transform .15s}
.fab:active{transform:translateY(-10px) scale(.94)}
.fab svg{width:28px;height:28px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;display:flex;justify-content:center;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1)}
.sheet .panel{width:100%;max-width:600px;background:var(--bg);border-radius:16px 16px 0 0;overflow-y:auto;max-height:92vh;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:2px auto 8px}
body.sheet-open .scrim{opacity:1}
body.sheet-open .sheet{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px}
.sh-head button{color:var(--ess);font-weight:600;font-size:16px;min-width:60px}
.sh-head button:last-child{text-align:right}
.sh-head b{font-size:17px}
.form{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.field{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:50px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:14px;right:0;border-top:1px solid var(--line)}
.field label{flex:none;min-width:96px;font-weight:500}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;outline:none;font-size:16px}
.field input[type=range]{accent-color:var(--fg)}
.field .unit{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0}
.switch{width:51px;height:31px;border-radius:16px;background:var(--card2);position:relative;flex:none;transition:background .2s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--pay);border-color:var(--pay)}
.switch.on::after{transform:translateX(20px)}
.quick{width:100%;border:0;background:var(--card);border-radius:14px;padding:16px;font-size:19px;font-weight:600;box-shadow:var(--shadow);outline:none}
.quick::placeholder{color:var(--faint);font-weight:500}
.amt-in{display:flex;align-items:baseline;justify-content:center;gap:2px;font-family:var(--f-disp);font-weight:800;font-size:44px;letter-spacing:-.03em;margin:14px 0 6px}
.amt-in input{border:0;background:transparent;outline:none;font:inherit;width:5.5ch;text-align:left;color:var(--fg);padding:0}
.amt-in span{color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;transition:all .25s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--pay);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--card);border-radius:12px;font-size:13px;color:var(--muted);margin:6px 0 4px;box-shadow:var(--shadow)}
.banner b{color:var(--fg)}
.banner button{margin-left:auto;color:var(--ess);font-weight:600;white-space:nowrap}
.welcome{padding:24px 18px;text-align:left}
.welcome h2{font-size:24px;margin-bottom:6px}
[hidden]{display:none!important}
.pop{animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:none}}
@media (max-width:420px){.big{font-size:42px}.stat b{font-size:16px}.day{min-height:56px}.day .n{font-size:16px;width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">
  <section class="view" id="v-period"></section>
  <section class="view" id="v-calendar" hidden></section>
  <section class="view" id="v-bills" hidden></section>
  <section class="view" id="v-insights" hidden></section>
</div>

<nav class="tabbar" aria-label="Sections">
  <div class="in">
    <button class="tab on" data-act="tab" data-v="period" id="t-period"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h4"/></svg>Paycheque</button>
    <button class="tab" data-act="tab" data-v="calendar" id="t-calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Calendar</button>
    <button class="fab" data-act="log" aria-label="Log spending or a payment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" data-act="tab" data-v="bills" id="t-bills"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Bills</button>
    <button class="tab" data-act="tab" data-v="insights" id="t-insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/></svg>Insights</button>
  </div>
</nav>

<div class="scrim" id="scrim" data-act="closeSheet" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"><div class="panel"><div class="grab"></div><div id="sheet-body"></div></div></div>
<div class="toast" id="toast" role="status"><span id="toast-msg"></span><button id="toast-undo" hidden>Undo</button></div>

<script>
(() => {
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAD = new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'});
const CAD0 = new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD',maximumFractionDigits:0});
const r2 = n => Math.round((+n||0)*100)/100;
const money = n => CAD.format(r2(n));
const money0 = n => CAD0.format(Math.round(+n||0));
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const dnum = s => { const [y,m,d] = s.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const fromNum = n => { const d = new Date(n*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; };
const addDays = (s,k) => fromNum(dnum(s)+k);
const today = () => ymd(new Date());
const dim = (y,m) => new Date(y,m+1,0).getDate();
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const WDS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtShort = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtDow = s => { const d = parse(s); return `${WDS[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = parse(s); return `${WDL[d.getDay()]}, ${MONTHS[d.getMonth()]} ${d.getDate()}`; };
const ordinal = n => n + (n%100>=11&&n%100<=13 ? 'th' : ['th','st','nd','rd'][n%10] || 'th');
const uid = () => Math.random().toString(36).slice(2,9);
const inRange = (d,p) => d >= p.start && d <= p.end;
const sum = (a,f=x=>x) => a.reduce((t,x)=>t+(+f(x)||0),0);
const noDash = s => String(s).replace(/\s*[—–]\s*/g, ', ');

/* ---------- model ---------- */
const TYPE = { bill:{label:'Bill', c:'--bill'}, subscription:{label:'Subscription', c:'--sub'}, debt:{label:'Debt', c:'--debt'} };
const BUCKET = {
  fun:{label:'Fun', c:'--fun'}, essential:{label:'Essentials', c:'--ess'},
  debt:{label:'Extra debt', c:'--debt'}, save:{label:'Savings', c:'--save'}, income:{label:'Income', c:'--pay'}
};
const FREQ = { monthly:'Monthly', biweekly:'Every 2 weeks', weekly:'Weekly', yearly:'Yearly', once:'One time' };
const PRESETS = [ {k:'debt', label:'Debt first', s:{debt:70,save:20,fun:10}}, {k:'bal', label:'Balanced', s:{debt:50,save:25,fun:25}}, {k:'breathe', label:'Breathe', s:{debt:30,save:30,fun:40}} ];
const blank = () => ({ v:1, settings:{payAmount:0,payFreq:'biweekly',payAnchor:today(),essentials:0,buffer:100,smooth:true,splits:{debt:50,save:25,fun:25}}, bills:[], paid:{}, log:[] });
function normalize(d){
  const b = blank();
  const s = Object.assign(b.settings, d && d.settings || {});
  s.splits = Object.assign({debt:50,save:25,fun:25}, s.splits||{});
  return { v:1, example:!!(d&&d.example), settings:s, bills:Array.isArray(d&&d.bills)?d.bills:[], paid:(d&&d.paid&&typeof d.paid==='object')?d.paid:{}, log:Array.isArray(d&&d.log)?d.log:[] };
}
let S = null;
const ui = { tab:'period', periodRef:null, calMonth:null, calSel:null, billFilter:'all' };

function occ(b, from, to){
  const out = []; if (!b || b.paused) return out;
  const F = dnum(from), T = dnum(to);
  if (b.freq === 'monthly'){
    let d = parse(from), y = d.getFullYear(), m = d.getMonth();
    for (let guard=0; guard<400; guard++){
      const day = Math.min(+b.dueDay||1, dim(y,m)); const s = `${y}-${pad(m+1)}-${pad(day)}`; const n = dnum(s);
      if (n > T) break; if (n >= F) out.push(s);
      if (++m > 11){ m = 0; y++; }
    }
  } else if (b.freq === 'weekly' || b.freq === 'biweekly'){
    const step = b.freq === 'weekly' ? 7 : 14; const A = dnum(b.anchor || from);
    for (let n = A + Math.ceil((F-A)/step)*step; n <= T; n += step) out.push(fromNum(n));
  } else if (b.freq === 'yearly'){
    const a = parse(b.anchor || from);
    for (let y = parse(from).getFullYear(); y <= parse(to).getFullYear(); y++){
      const s = `${y}-${pad(a.getMonth()+1)}-${pad(Math.min(a.getDate(), dim(y,a.getMonth())))}`; const n = dnum(s);
      if (n >= F && n <= T) out.push(s);
    }
  } else if (b.freq === 'once'){
    if (b.anchor && dnum(b.anchor) >= F && dnum(b.anchor) <= T) out.push(b.anchor);
  }
  return b.since ? out.filter(s => s >= b.since) : out;
}
const perMonth = b => b.freq==='monthly'?+b.amount : b.freq==='biweekly'?b.amount*26/12 : b.freq==='weekly'?b.amount*52/12 : b.freq==='yearly'?b.amount/12 : 0;
const payPerMonth = () => { const f=S.settings.payFreq; return S.settings.payAmount*(f==='weekly'?52/12:f==='biweekly'?26/12:f==='semimonthly'?2:1); };
const periodsPerMonth = () => { const f=S.settings.payFreq; return f==='weekly'?52/12:f==='biweekly'?26/12:f==='semimonthly'?2:1; };

function periodOf(d){
  const s = S.settings;
  if (s.payFreq === 'semimonthly'){ const x=parse(d), y=x.getFullYear(), m=x.getMonth();
    return x.getDate() < 15 ? {start:`${y}-${pad(m+1)}-01`, end:`${y}-${pad(m+1)}-14`} : {start:`${y}-${pad(m+1)}-15`, end:`${y}-${pad(m+1)}-${pad(dim(y,m))}`}; }
  if (s.payFreq === 'monthly'){ const x=parse(d), y=x.getFullYear(), m=x.getMonth(); return {start:`${y}-${pad(m+1)}-01`, end:`${y}-${pad(m+1)}-${pad(dim(y,m))}`}; }
  const step = s.payFreq === 'weekly' ? 7 : 14; const A = dnum(s.payAnchor || today()); const N = dnum(d);
  const st = A + Math.floor((N-A)/step)*step; return {start:fromNum(st), end:fromNum(st+step-1)};
}
const nextPeriod = p => periodOf(addDays(p.end,1));
const prevPeriod = p => periodOf(addDays(p.start,-1));
const isPayday = d => S.settings.payAmount > 0 && periodOf(d).start === d;

function periodItems(p){
  const items = [];
  for (const b of S.bills) for (const d of occ(b,p.start,p.end)){
    const key = b.id+'|'+d, rec = S.paid[key];
    items.push({b, date:d, key, paid:!!rec, paidOn:rec&&rec.on, amount: rec&&rec.amount!=null ? +rec.amount : +b.amount});
  }
  return items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.b.name.localeCompare(b.b.name));
}
function stats(p){
  const items = periodItems(p);
  const logs = S.log.filter(e => inRange(e.date,p));
  const spent = {fun:0,essential:0,debt:0,save:0};
  let extra = 0;
  for (const e of logs){ if (e.bucket==='income') extra += +e.amount; else spent[e.bucket] = (spent[e.bucket]||0) + (+e.amount); }
  const income = S.settings.payAmount + extra;
  const billsTotal = sum(items, i=>i.amount), billsPaid = sum(items.filter(i=>i.paid), i=>i.amount);
  return {p, items, logs, spent, extra, income, billsTotal, billsPaid, billsLeft: billsTotal-billsPaid};
}
function plan(p){
  const st = stats(p), s = S.settings;
  const nx = stats(nextPeriod(p));
  const nextNeed = nx.billsTotal + s.essentials + s.buffer - s.payAmount;
  const hold = s.smooth ? Math.max(0, nextNeed) : 0;
  const essUse = Math.max(st.spent.essential, s.essentials);
  const free = st.income - st.billsTotal - essUse - s.buffer - hold;
  const fp = Math.max(0, free);
  const sp = s.splits, tot = (sp.debt+sp.save+sp.fun)||1;
  const alloc = {debt:fp*sp.debt/tot, save:fp*sp.save/tot, fun:fp*sp.fun/tot};
  const left = {debt:alloc.debt-st.spent.debt, save:alloc.save-st.spent.save, fun:alloc.fun-st.spent.fun};
  const spentAll = st.spent.fun+st.spent.essential+st.spent.debt+st.spent.save;
  const cash = st.income - st.billsPaid - spentAll;
  const mustKeep = st.billsLeft + Math.max(0, s.essentials-st.spent.essential) + s.buffer + hold + Math.max(0,left.debt) + Math.max(0,left.save);
  const safeFun = Math.max(0, Math.min(left.fun, cash - mustKeep));
  return {...st, nx, hold, nextNeed, essUse, free, alloc, left, cash, safeFun, spentAll};
}
function overdue(){
  const t = today(), from = addDays(t,-60), to = addDays(t,-1);
  const out = [];
  for (const b of S.bills) for (const d of occ(b,from,to)) if (!S.paid[b.id+'|'+d]) out.push({b, date:d, key:b.id+'|'+d, amount:+b.amount});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* ---------- storage ---------- */
const LS = 'paycheque-planner-v1';
let store = 'local', dbDoc = null, saveTimer = null;
const lsGet = () => { try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };
const withTimeout = (pr, ms, v) => Promise.race([pr, new Promise(r => setTimeout(() => r(v), ms))]);
function setSaveState(t){ document.querySelectorAll('.save-state').forEach(el => el.textContent = t); }
function save(){
  clearTimeout(saveTimer); setSaveState('Saving…');
  saveTimer = setTimeout(async () => {
    const data = JSON.parse(JSON.stringify(S));
    if (store === 'db' && dbDoc){
      try { await dbDoc.set(data); setSaveState('Saved'); }
      catch (e) { lsSet(data); setSaveState('Saved on this device only'); }
    } else { lsSet(data); setSaveState('Saved on this device'); }
  }, 450);
}
async function boot(){
  renderAll();
  let db = null;
  try { if (window.claude && window.claude.use) db = await withTimeout(window.claude.use('db'), 11000, null); } catch { db = null; }
  if (db){
    try {
      dbDoc = db.doc('ledger/main');
      const snap = await withTimeout(dbDoc.get(), 10000, 'timeout');
      if (snap === 'timeout') throw new Error('timeout');
      S = normalize(snap.exists ? snap.data() : (lsGet() || blank()));
      store = 'db';
    } catch { S = normalize(lsGet() || blank()); store = 'local'; }
  } else { S = normalize(lsGet() || blank()); store = 'local'; }
  routeFromHash(); renderAll();
}

/* ---------- render: shared ---------- */
const cssv = v => `var(${v})`;
function tile(b){ const t = TYPE[b.type]||TYPE.bill; return `<span class="tile" style="background:${cssv(t.c)}">${esc((b.name||'?').trim().charAt(0).toUpperCase())}</span>`; }
function billWhen(b){
  if (b.freq==='monthly') return `Monthly on the ${ordinal(+b.dueDay||1)}`;
  if (b.freq==='yearly') return `Yearly on ${fmtShort(b.anchor)}`;
  if (b.freq==='once') return `Once on ${fmtShort(b.anchor)}`;
  return `${FREQ[b.freq]} from ${fmtShort(b.anchor)}`;
}
function topBar(eyebrow, title, right=''){
  return `<div class="top"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1></div><div class="row" style="gap:8px">${right}</div></div>`;
}
const loadingView = () => `<div class="top"><div><div class="eyebrow">Loading</div><h1>Paycheque</h1></div></div><div class="card pad"><div class="think"><i></i><i></i><i></i>&nbsp;Opening your money…</div></div>`;
function exampleBanner(){
  if (!S || !S.example) return '';
  return `<div class="banner"><span><b>Example data.</b> These bills are samples so you can see how it works.</span><button data-act="settings">Make it mine</button></div>`;
}
function billRowDue(i, opts={}){
  const late = opts.late;
  const sub = [fmtDow(i.date)];
  if (i.paid) sub.push(i.paidOn && i.paidOn!==i.date ? `Paid ${fmtShort(i.paidOn)}` : 'Paid');
  else if (i.b.autopay) sub.push('Autopay');
  if (i.b.type==='subscription') sub.push('Subscription');
  return `<div class="item ${i.paid?'done':''}">
    <button class="check ${i.paid?'on':''} ${late?'over':''}" data-act="togglePaid" data-k="${esc(i.key)}" data-amt="${i.amount}" aria-label="${i.paid?'Mark unpaid':'Mark paid'}: ${esc(i.b.name)}">${ICON.check}</button>
    <button class="main" data-act="editBill" data-id="${esc(i.b.id)}" style="text-align:left">
      <div class="t">${esc(i.b.name)} ${late?'<span class="tag red">Overdue</span>':''}</div>
      <div class="s">${esc(sub.join(' · '))}</div>
    </button>
    <div class="amt">${money(i.amount)}</div>
  </div>`;
}
function logRow(e){
  const B = BUCKET[e.bucket]||BUCKET.fun;
  return `<button class="item" data-act="editLog" data-id="${esc(e.id)}">
    <span class="tile" style="background:${cssv(B.c)}">${esc((e.note||B.label).trim().charAt(0).toUpperCase())}</span>
    <div class="main"><div class="t">${esc(e.note||B.label)}</div><div class="s">${esc(B.label)} · ${fmtDow(e.date)}</div></div>
    <div class="amt" style="${e.bucket==='income'?'color:var(--pay)':''}">${e.bucket==='income'?'+':''}${money(e.amount)}</div>
  </button>`;
}
function ring(pct, color){
  const r = 23, c = 2*Math.PI*r, v = Math.max(0, Math.min(1, pct));
  return `<svg class="ring" viewBox="0 0 54 54"><circle cx="27" cy="27" r="${r}" fill="none" stroke="var(--card2)" stroke-width="6"/><circle cx="27" cy="27" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 27 27)"/></svg>`;
}

/* ---------- render: Paycheque ---------- */
function renderPeriod(){
  const el = $('#v-period');
  if (!S){ el.innerHTML = loadingView(); return; }
  const gear = `<button class="icon-btn" data-act="settings" aria-label="Paycheque settings">${ICON.gear}</button>`;
  if (!S.settings.payAmount && !S.bills.length){
    el.innerHTML = topBar('Welcome', 'Paycheque', gear) + `
      <div class="card welcome stack">
        <h2>Let's map your paycheque.</h2>
        <p class="muted" style="margin:0">Three steps. Tell it what you get paid and when, add the bills that come out, then log spending as it happens. It works out what's left, what's safe for fun, and what should go to debt.</p>
        <button class="btn primary wide" data-act="settings">1. Set up my paycheque</button>
        <button class="btn wide" data-act="newBill">2. Add my first bill</button>
      </div><div class="save-state" style="margin-top:8px"></div>`;
    return;
  }
  const ref = ui.periodRef || today();
  const p = periodOf(ref), P = plan(p), s = S.settings;
  const t = today(), isNow = inRange(t,p);
  const daysLeft = dnum(p.end) - dnum(t) + 1;
  const eyebrow = isNow ? `${daysLeft} day${daysLeft===1?'':'s'} until payday` : (p.start > t ? 'Upcoming paycheque' : 'Past paycheque');
  const nav = `<div class="pnav"><button data-act="pPrev" aria-label="Previous pay period">${ICON.left}</button>${isNow?'':'<button data-act="pNow" class="small" style="width:auto;padding:0 8px;color:var(--ess);font-weight:600">Now</button>'}<button data-act="pNext" aria-label="Next pay period">${ICON.right}</button></div>`;
  const inc = Math.max(P.income, 1);
  const seg = [
    ['--bill', P.billsPaid, 'Bills paid', .55], ['--bill', P.billsLeft, 'Bills to pay', 1],
    ['--ess', P.essUse, 'Essentials', 1], ['--hold', s.buffer, 'Buffer', 1],
    ['--hold', P.hold, 'Held for next', 1, true],
    ['--debt', P.alloc.debt, 'Debt', 1], ['--save', P.alloc.save, 'Savings', 1], ['--fun', P.alloc.fun, 'Fun', 1]
  ].filter(x => x[1] > 0.5);
  const segTotal = Math.max(inc, sum(seg, x => x[1]));
  const meter = seg.map(x => `<i class="${x[4]?'hatch':''}" style="flex:0 0 calc(${(x[1]/segTotal)*100}% - 2px);background:${cssv(x[0])};opacity:${x[3]}" title="${esc(x[2])}: ${money(x[1])}"></i>`).join('');
  const legend = seg.map(x => `<span><i class="dot" style="background:${cssv(x[0])};opacity:${x[3]}"></i>${x[2]} ${money0(x[1])}</span>`).join('');
  const subBits = [`after ${money0(P.billsTotal)} in bills`, `${money0(P.essUse)} essentials`, `${money0(s.buffer)} buffer`];
  if (P.hold > 0) subBits.push(`${money0(P.hold)} held for next paycheque`);
  const od = isNow ? overdue().filter(o => o.date < p.start) : [];
  const funPct = P.alloc.fun > 0 ? P.safeFun / P.alloc.fun : 0;
  let guardMsg;
  if (P.free <= 0) guardMsg = 'Nothing is free this paycheque. Bills and essentials come first.';
  else if (P.left.fun <= 0) guardMsg = `Fun budget used up (${money(P.spent.fun)} of ${money(P.alloc.fun)}). Next fun money arrives ${fmtShort(addDays(p.end,1))}.`;
  else if (P.safeFun < P.left.fun) guardMsg = `You have ${money(P.left.fun)} of fun budget, but ${money(P.left.fun-P.safeFun)} of it is still covering bills you haven't paid. Pay those first.`;
  else guardMsg = `Bills, essentials, debt and savings are covered. This is yours to spend guilt-free.`;
  const preset = PRESETS.find(x => x.s.debt===s.splits.debt && x.s.save===s.splits.save && x.s.fun===s.splits.fun);
  const bucketRow = (k, label, color) => {
    const a = P.alloc[k], sp = P.spent[k], pct = a>0 ? Math.min(1, sp/a) : (sp>0?1:0), over = sp > a + .005;
    return `<div class="bucket"><i class="dot" style="background:${cssv(color)};width:10px;height:10px"></i><div class="name">${label}</div><div class="amt num" style="font-weight:700">${money(a)}</div>
      <div class="prog"><i style="width:${pct*100}%;background:${over?'var(--red)':cssv(color)}"></i></div>
      <div class="meta num"><span>${k==='fun'?'Spent':'Put in'} ${money(sp)}</span><span style="${over?'color:var(--red);font-weight:600':''}">${over?`Over by ${money(sp-a)}`:`${money(a-sp)} to go`}</span></div></div>`;
  };
  const recent = P.logs.slice().sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.at||0)-(a.at||0)).slice(0,6);
  el.innerHTML = topBar(eyebrow, `${fmtShort(p.start)} – ${fmtShort(p.end)}`, nav + gear) + exampleBanner() + `

function monthEvents(y, m){
  const start = `${y}-${pad(m+1)}-01`, end = `${y}-${pad(m+1)}-${pad(dim(y,m))}`;
  const map = {};
  const get = d => map[d] || (map[d] = {bills:[], logs:[]});
  for (const b of S.bills) for (const d of occ(b,start,end)){ const k=b.id+'|'+d, rec=S.paid[k]; get(d).bills.push({b, date:d, key:k, paid:!!rec, paidOn:rec&&rec.on, amount: rec&&rec.amount!=null?+rec.amount:+b.amount}); }
  for (const e of S.log) if (e.date >= start && e.date <= end) get(e.date).logs.push(e);
  return {map, start, end};
}

    <div class="list">${rows.length ? rows.join('') : `<div class="empty">Nothing due or logged.</div>`}</div>
    <div class="cal-sum">
      <div class="stat"><span>Due in ${MON[mi]}</span><b class="num">${money0(mDue)}</b></div>
      <div class="stat"><span>Paid</span><b class="num" style="color:var(--pay)">${money0(mPaid)}</b></div>

  const g = $('#cal-grid'); let x0 = null;

function monthsOut(n){ const d = new Date(); d.setMonth(d.getMonth()+n); const y = Math.floor(n/12), mo = n%12; return `${MON[d.getMonth()]} ${d.getFullYear()} (${y?`${y}y `:''}${mo}m)`; }
function payoff(debts, extra){
  const ds = debts.map(d => ({bal:+d.balance||0, r:(+d.apr||0)/1200, min:perMonth(d)}));
  let interest = 0;
  for (let m=1; m<=600; m++){
    let pool = extra;
    for (const d of ds){
      if (d.bal <= 0.005){ pool += d.min; continue; }
      const i = d.bal*d.r; interest += i; d.bal += i;
      const pay = Math.min(d.min, d.bal); d.bal -= pay; pool += d.min - pay;
    }
    for (const d of ds.slice().sort((a,b)=>b.r-a.r)){ if (d.bal > 0.005 && pool > 0){ const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    if (ds.every(d => d.bal <= 0.005)) return {months:m, interest};
  }
  return {months:Infinity, interest};
}

/* ---------- render: Insights ---------- */
function detectRecurring(){
  const groups = {};
  for (const e of S.log){ if (e.bucket==='income' || !e.note) continue; const k = e.note.toLowerCase().replace(/[^a-z+ ]/g,'').trim(); if (k.length<3) continue; (groups[k] = groups[k]||[]).push(e); }
  const known = S.bills.map(b => b.name.toLowerCase());
  const out = [];
  for (const [k, es] of Object.entries(groups)){
    const months = new Set(es.map(e=>e.date.slice(0,7)));
    if (months.size < 2) continue;
    const amts = es.map(e=>+e.amount), avg = sum(amts)/amts.length;
    if (amts.some(a => Math.abs(a-avg) > avg*.12)) continue;
    if (known.some(n => n.includes(k) || k.includes(n))) continue;
    const last = es.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
    out.push({name:last.note, amount:r2(avg), day:parse(last.date).getDate(), count:es.length});
  }
  return out;
}
function insights(){
  const out = [], t = today();
  if (!S.settings.payAmount) return [{c:'--ess', i:ICON.alert, t:'Add your paycheque', d:'Insights need to know what you get paid and when.', a:`<button class="btn sm primary" data-act="settings">Set up paycheque</button>`}];
  const p = periodOf(t), P = plan(p), s = S.settings;
  const od = overdue();
  if (od.length) out.push({c:'--red', i:ICON.alert, t:`${od.length} bill${od.length>1?'s':''} not marked paid`, d:`${od.slice(0,3).map(o=>`${o.b.name} (${fmtShort(o.date)})`).join(', ')}${od.length>3?' and more':''}. If you already paid, tap to tick them off so the math stays right.`, a:`<button class="btn sm" data-act="tab" data-v="period">Review</button>`});
  const soon = P.items.filter(i => !i.paid && i.date >= t && dnum(i.date)-dnum(t) <= 3);
  if (soon.length) out.push({c:'--bill', i:ICON.clock, t:`Due in the next 3 days: ${money(sum(soon,i=>i.amount))}`, d:soon.map(i=>`${i.b.name} ${fmtDow(i.date)}${i.b.autopay?' (autopay)':''}`).join(', ')+'.'});
  if (P.nextNeed > 0) out.push({c:'--hold', i:ICON.shield, t:`Next paycheque is short by ${money(P.nextNeed)}`, d:`${fmtShort(P.nx.p.start)} – ${fmtShort(P.nx.p.end)} has ${money(P.nx.billsTotal)} in bills${P.nx.items.some(i=>i.amount>=s.payAmount*.4)?` (${P.nx.items.filter(i=>i.amount>=s.payAmount*.4).map(i=>i.b.name).join(', ')} lands there)`:''}. ${s.smooth?`The planner is already holding ${money(P.hold)} back from this one so you don't get caught.`:'Turn on "Hold for next paycheque" in settings so this one covers the gap.'}`});
  else if (P.nx.billsTotal < s.payAmount*.25) out.push({c:'--pay', i:ICON.trend, t:'Light paycheque ahead', d:`Only ${money(P.nx.billsTotal)} in bills next period. Good time to push extra at debt.`});
  const elapsed = Math.min(1, (dnum(t)-dnum(p.start)+1)/(dnum(p.end)-dnum(p.start)+1));
  if (P.alloc.fun > 0 && P.spent.fun > P.alloc.fun*elapsed*1.15 && P.spent.fun > 20) out.push({c:'--fun', i:ICON.trend, t:'Fun spending is running ahead', d:`${Math.round(P.spent.fun/P.alloc.fun*100)}% of fun money gone with ${Math.round(elapsed*100)}% of the pay period done. At this pace you run out around ${fmtShort(addDays(p.start, Math.floor((dnum(p.end)-dnum(p.start)+1)*Math.min(1,P.alloc.fun/P.spent.fun*elapsed))))}.`});
  else if (P.spent.fun > P.alloc.fun && P.alloc.fun >= 0 && P.spent.fun > 0) out.push({c:'--fun', i:ICON.alert, t:`Fun is over by ${money(P.spent.fun-P.alloc.fun)}`, d:'That came out of debt or savings money. Next paycheque, try the "Breathe" split or log essentials separately so fun is not hiding them.'});
  const subs = S.bills.filter(b=>b.type==='subscription');
  if (subs.length){ const yr = sum(subs,perMonth)*12; const top = subs.slice().sort((a,b)=>perMonth(b)-perMonth(a)).slice(0,3);
    out.push({c:'--sub', i:ICON.repeat, t:`${subs.length} subscriptions cost ${money0(yr)} a year`, d:`Biggest: ${top.map(b=>`${b.name} ${money(perMonth(b))}/mo`).join(', ')}. Cancelling one you barely use is the easiest raise you'll get.`}); }
  for (const r of detectRecurring().slice(0,3)) out.push({c:'--sub', i:ICON.repeat, t:`Looks like a subscription: ${r.name}`, d:`You've logged about ${money(r.amount)} ${r.count} times in different months. Track it as a subscription so it's planned, not a surprise.`, a:`<button class="btn sm primary" data-act="addDetected" data-name="${esc(r.name)}" data-amt="${r.amount}" data-day="${r.day}">Add as subscription</button>`});
  const fixed = sum(S.bills.filter(b=>b.type!=='subscription'), perMonth), inc = payPerMonth();
  if (inc) out.push({c:'--ess', i:ICON.shield, t:`Bills take ${Math.round(sum(S.bills,perMonth)/inc*100)}% of your pay`, d:`${money0(sum(S.bills,perMonth))} of about ${money0(inc)} a month. ${sum(S.bills,perMonth)/inc>.6?'Above 60% leaves very little room. Debt payoff or a cheaper big bill will help more than cutting coffee.':'That leaves healthy room to plan.'}`});
  const debts = S.bills.filter(b=>b.type==='debt'&&+b.balance>0);
  if (debts.length){ const top = debts.slice().sort((a,b)=>(+b.apr||0)-(+a.apr||0))[0];
    out.push({c:'--debt', i:ICON.trend, t:`Extra debt money goes to ${top.name} first`, d:`At ${+top.apr||0}% it's your most expensive debt. Every extra dollar there saves the most interest.`}); }
  return out;
}

/* Log sheet */
const KW = {
  income:/\b(got paid|paycheque|paycheck|refund|cash ?back|e-?transfer from|sold|bonus|tips?|side gig|income|received|deposit)\b/,
  save:/\b(save|saving|savings|tfsa|rrsp|fhsa|emergency fund|invest|wealthsimple|questrade)\b/,
  debt:/\b(debt|credit card|visa|mastercard|amex|loan|line of credit|osap|extra payment)\b/,
  essential:/\b(grocer\w*|costco|walmart|no ?frills|loblaws|metro|sobeys|food basics|freshco|superstore|gas|petro|esso|shell|pioneer|ultramar|pharmacy|shoppers|rexall|presto|transit|ttc|parking|laundry|doctor|dentist|meds?|medication|toiletries|diapers|hydro)\b/,
  fun:/\b(coffee|starbucks|tim ?hortons|timmies|uber ?eats|doordash|skip|restaurant|bar|pub|beer|wine|lcbo|movies?|cineplex|concert|games?|steam|playstation|xbox|shopping|amazon|clothes|shoes|takeout|lunch|dinner|brunch|mcdonald'?s|pizza|sushi|date|gift|drinks?|club|tickets?)\b/
};
function parseLog(text){
  const s = text.toLowerCase(), r = {};
  const m = s.match(/\$?\s*(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?/);
  let note = text;
  if (m){ r.amount = parseFloat(m[1].replace(/,/g,'') + '.' + (m[2]||'0')); note = note.replace(m[0].trim().startsWith('$')?m[0].trim():m[0].trim(), ' '); }
  if (/\byesterday\b/.test(s)){ r.date = addDays(today(),-1); note = note.replace(/\byesterday\b/i,' '); }
  else if (/\btoday\b/.test(s)) note = note.replace(/\btoday\b/i,' ');
  for (const k of ['income','save','debt','essential','fun']) if (KW[k].test(s)){ r.bucket = k; break; }
  note = note.replace(/^\s*(i\s+)?(spent|paid|bought|got|for|on|at)\s+/i,'').replace(/\s+(on|at|for)\s*$/i,'').replace(/\s{2,}/g,' ').trim();
  r.note = note ? note.charAt(0).toUpperCase() + note.slice(1) : '';
  const t = today(), p = periodOf(t);
  const cands = [...overdue(), ...periodItems(p).filter(i=>!i.paid)];
  const words = s.split(/[^a-z0-9]+/).filter(w=>w.length>=3);
  const hit = cands.find(c => { const n = c.b.name.toLowerCase(); return s.includes(n) || n.split(/[^a-z0-9]+/).some(w => w.length>=4 && words.includes(w)); });
  if (hit) r.bill = hit;
  return r;
}

async function getSample(){ try { return window.claude && window.claude.use ? await withTimeout(window.claude.use('sample'), 11000, null) : null; } catch { return null; } }
function mdLite(t){
  const lines = esc(noDash(t)).split(/\n/); let html = '', inList = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,4}\s*(.+)$/,'<strong>$1</strong>');
    if (/^\s*[-*•]\s+/.test(l)){ if (!inList){ html += '<ul>'; inList = true; } html += `<li>${l.replace(/^\s*[-*•]\s+/,'')}</li>`; }
    else { if (inList){ html += '</ul>'; inList = false; } if (l.trim()) html += `<p>${l}</p>`; }
  }
  return html + (inList ? '</ul>' : '');
}
function summary(){
  const t = today(), p = periodOf(t), P = plan(p);
  return {
    today: t, currency:'CAD', payFrequency:S.settings.payFreq, takeHomePay:S.settings.payAmount,
    currentPayPeriod:{start:p.start, end:p.end, income:r2(P.income), billsTotal:r2(P.billsTotal), billsPaid:r2(P.billsPaid), billsStillToPay:r2(P.billsLeft),
      bills:P.items.map(i=>({name:i.b.name, due:i.date, amount:i.amount, paid:i.paid, type:i.b.type})),
      essentialsBudget:S.settings.essentials, buffer:S.settings.buffer, heldForNextPaycheque:r2(P.hold), freeToPlan:r2(P.free),
      plan:{debt:r2(P.alloc.debt), savings:r2(P.alloc.save), fun:r2(P.alloc.fun)}, spentSoFar:{fun:r2(P.spent.fun), essentials:r2(P.spent.essential), extraDebt:r2(P.spent.debt), savings:r2(P.spent.save)},
      cashOnHand:r2(P.cash), safeToSpendOnFunNow:r2(P.safeFun)},
    nextPayPeriod:{start:P.nx.p.start, end:P.nx.p.end, billsTotal:r2(P.nx.billsTotal), bills:P.nx.items.map(i=>({name:i.b.name, due:i.date, amount:i.amount}))},
    overdueUnmarked: overdue().map(o=>({name:o.b.name, due:o.date, amount:o.amount})),
    allRecurring: S.bills.map(b=>({name:b.name, type:b.type, frequency:b.freq, amount:+b.amount, perMonth:r2(perMonth(b)), balance:b.balance!=null?+b.balance:undefined, aprPercent:b.apr!=null?+b.apr:undefined})),

}

      ${rec.length?`<div class="lbl">Recurring bills found</div><div class="list">${rec.map((r,i)=>`<label class="item"><input type="checkbox" checked data-imp="r${i}" style="width:20px;height:20px;accent-color:var(--pay)"><div class="main"><div class="t">${esc(r.name)}</div><div class="s">${esc((TYPE[r.type]||TYPE.bill).label)} · ${esc(FREQ[r.freq]||'Monthly')}${r.freq==='monthly'||!r.freq?` on the ${ordinal(+r.dueDay||1)}`:''}</div></div><div class="amt">${money(r.amount)}</div></label>`).join('')}</div>`:''}
      ${tx.length?`<div class="lbl">Spending and income</div><div class="list">${tx.map((t,i)=>`<label class="item"><input type="checkbox" checked data-imp="t${i}" style="width:20px;height:20px;accent-color:var(--pay)"><div class="main"><div class="t">${esc(t.note||'Purchase')}</div><div class="s">${esc((BUCKET[t.bucket]||BUCKET.fun).label)} · ${fmtDow(t.date)}</div></div><div class="amt">${money(t.amount)}</div></label>`).join('')}</div>`:''}
      <button class="btn green wide" style="margin-top:12px" data-act="importAdd">Add selected</button>`;
  } catch (e) {
    out.innerHTML = `<p class="small muted">${e && e.code==='not_granted' ? 'Claude access was declined for this page.' : e && e.code==='rate_limited' ? 'Claude is busy right now. Try again in a minute.' : "Couldn't read that. Try a shorter paste."}</p>`;
  }
}

/* ---------- actions ---------- */
function dropExample(){ if (S.example){ S.example = false; } }
const act = {
  tab: d => { ui.tab = d.v; try { history.replaceState(null,'','#'+d.v); } catch { location.hash = d.v; } syncTabs(); rerender(); window.scrollTo({top:0}); },
  log: d => openLog({date:d.date}),
  closeSheet: () => closeSheet(),
  settings: () => openSettings(),
  newBill: () => openBill(null),
  editBill: d => openBill(S.bills.find(b => b.id === d.id)),
  editLog: d => { const e = S.log.find(x => x.id === d.id); if (e) openLog({entry:e}); },
  togglePaid: (d, el) => {
    const k = d.k, was = S.paid[k];
    if (was) delete S.paid[k]; else S.paid[k] = {on: today(), amount: r2(d.amt)};
    save(); rerender();
    const name = (S.bills.find(b => b.id === k.split('|')[0])||{}).name || 'Bill';
    if (!was){ const c = document.querySelector(`[data-act="togglePaid"][data-k="${CSS.escape(k)}"]`); c && c.classList.add('pop'); }
    toast(was ? `${name} marked unpaid` : `${name} paid`, () => { if (was) S.paid[k] = was; else delete S.paid[k]; save(); rerender(); });
  },
  quickPay: d => { S.paid[d.k] = {on: today(), amount: r2(d.amt)}; save(); closeSheet(); rerender(); const name = (S.bills.find(b => b.id === d.k.split('|')[0])||{}).name; toast(`${name} paid`, () => { delete S.paid[d.k]; save(); rerender(); }); },
  pickBucket: d => setBucket(d.k),
  pickDebt: d => { $('#l-debt').value = d.id; document.querySelectorAll('[data-act="pickDebt"]').forEach(c => c.classList.toggle('on', c.dataset.id===d.id)); },
  pickDate: d => setDate(d.d),
  saveLog: () => {
    const editing = openLog.editing;
    const r = parseLog(val('l-text'));
    let amount = parseFloat(String(val('l-amt')).replace(/[$,\s]/g,''));
    if (!editing && r.bill && (isNaN(amount) || Math.abs(amount - r.bill.amount) < .01 || /\bpaid|pay\b/i.test(val('l-text')))){
      return act.quickPay({k:r.bill.key, amt: isNaN(amount) ? r.bill.amount : amount});
    }
    if (isNaN(amount) || amount <= 0){ const a = $('#l-amt'); a.focus(); a.parentElement.classList.remove('pop'); void a.offsetWidth; a.parentElement.classList.add('pop'); $('#l-hint').textContent = 'Add an amount, like "12.50".'; return; }
    const bucket = val('l-bucket'), note = (editing && val('l-text').trim()===editing.note) ? editing.note : (r.note || val('l-text').trim());
    const debtId = bucket==='debt' ? val('l-debt') || null : null;
    if (editing){
      if (editing.debtId){ const db = S.bills.find(b=>b.id===editing.debtId); if (db && db.balance!=null) db.balance = r2(+db.balance + +editing.amount); }
      Object.assign(editing, {amount:r2(amount), bucket, note, date:val('l-date'), debtId});
      if (debtId){ const db = S.bills.find(b=>b.id===debtId); if (db && db.balance!=null) db.balance = r2(Math.max(0, db.balance - amount)); }
      save(); closeSheet(); rerender(); toast('Entry updated');
    } else {
      const e = {id:uid(), date:val('l-date'), amount:r2(amount), bucket, note, at:Date.now()};
      if (debtId){ e.debtId = debtId; const db = S.bills.find(b=>b.id===debtId); if (db && db.balance!=null) db.balance = r2(Math.max(0, db.balance - amount)); }
      S.log.push(e); save(); closeSheet(); rerender();
      toast(`${money(amount)} ${BUCKET[bucket].label.toLowerCase()} logged`, () => { S.log = S.log.filter(x=>x.id!==e.id); if (e.debtId){ const db = S.bills.find(b=>b.id===e.debtId); if (db && db.balance!=null) db.balance = r2(+db.balance + e.amount); } save(); rerender(); });
    }
  },
  delLog: d => {
    const e = S.log.find(x=>x.id===d.id); if (!e) return;
    S.log = S.log.filter(x=>x.id!==d.id);
    if (e.debtId){ const db = S.bills.find(b=>b.id===e.debtId); if (db && db.balance!=null) db.balance = r2(+db.balance + +e.amount); }
    save(); closeSheet(); rerender();
    toast('Entry deleted', () => { S.log.push(e); if (e.debtId){ const db = S.bills.find(b=>b.id===e.debtId); if (db && db.balance!=null) db.balance = r2(Math.max(0, db.balance - e.amount)); } save(); rerender(); });
  },
  seg: d => { document.getElementById(d.target).value = d.v; document.querySelectorAll(`[data-seg="${d.target}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v===d.v)); openBill.sync && openBill.sync(); },
  switch: (d, el) => { el.classList.toggle('on'); el.setAttribute('aria-checked', el.classList.contains('on')); },
  saveBill: d => {
    const name = val('b-name').trim(), amount = parseFloat(String(val('b-amt')).replace(/[$,\s]/g,''));
    if (!name){ $('#b-name').focus(); return; }
    if (isNaN(amount) || amount < 0){ $('#b-amt').focus(); return; }
    const freq = val('b-freq'), type = val('b-type');
    let b = S.bills.find(x => x.id === d.id);
    const fresh = !b;
    if (fresh){ b = {id:d.id}; S.bills.push(b); }
    Object.assign(b, {name, amount:r2(amount), type, freq, autopay: $('#b-auto').classList.contains('on')});
    if (freq === 'monthly'){ b.dueDay = +val('b-day'); delete b.anchor; } else { b.anchor = val('b-date') || today(); delete b.dueDay; }
    if (type === 'debt'){ const bal = parseFloat(String(val('b-bal')).replace(/[$,\s]/g,'')), apr = parseFloat(val('b-apr')); b.balance = isNaN(bal)?null:r2(bal); b.apr = isNaN(apr)?null:apr; } else { delete b.balance; delete b.apr; }
    if (fresh){
      const t = today(), p = S.settings.payAmount ? periodOf(t) : {start:t};
      b.since = freq==='monthly' ? p.start : (b.anchor < p.start ? p.start : b.anchor);
    }
    save(); closeSheet(); rerender(); toast(fresh ? `${name} added` : `${name} saved`);
  },
  delBill: (d, el) => {
    if (!el.dataset.confirm){ el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if (el.isConnected){ delete el.dataset.confirm; el.textContent = 'Delete bill'; } }, 3000); return; }
    const b = S.bills.find(x=>x.id===d.id); const prevPaid = {...S.paid};
    S.bills = S.bills.filter(x => x.id !== d.id);
    for (const k of Object.keys(S.paid)) if (k.startsWith(d.id+'|')) delete S.paid[k];
    save(); closeSheet(); rerender();
    toast(`${b?b.name:'Bill'} deleted`, () => { if (b){ S.bills.push(b); S.paid = prevPaid; save(); rerender(); } });
  },
  saveSettings: () => {
    const s = S.settings, num = id => { const v = parseFloat(String(val(id)).replace(/[$,\s]/g,'')); return isNaN(v) ? 0 : r2(v); };
    s.payAmount = num('s-pay'); s.payFreq = val('s-freq'); s.payAnchor = val('s-anchor') || today();
    s.essentials = num('s-ess'); s.buffer = num('s-buf'); s.smooth = $('#s-smooth').classList.contains('on');
    const a = +val('s-debt'), b = +val('s-save'); s.splits = {debt:a, save:b, fun:Math.max(0,100-a-b)};
    ui.periodRef = null; save(); closeSheet(); renderAll(); toast('Paycheque updated');
  },
  preset: d => { const x = PRESETS.find(p=>p.k===d.k); if (!x) return; S.settings.splits = {...x.s}; save(); rerender(); toast(`${x.label}: ${x.s.debt}% debt, ${x.s.save}% savings, ${x.s.fun}% fun`); },
  pPrev: () => { ui.periodRef = prevPeriod(periodOf(ui.periodRef||today())).start; renderPeriod(); },
  pNext: () => { ui.periodRef = nextPeriod(periodOf(ui.periodRef||today())).start; renderPeriod(); },
  pNow: () => { ui.periodRef = null; renderPeriod(); },
  calSel: d => { ui.calSel = d.d; renderCalendar(); },
  calPrev: () => shiftMonth(-1), calNext: () => shiftMonth(1),
  calToday: () => { ui.calMonth = today().slice(0,7); ui.calSel = today(); renderCalendar(); },
  billFilter: d => { ui.billFilter = d.k; renderBills(); },
  addDetected: d => { S.bills.push({id:uid(), name:d.name, amount:r2(d.amt), type:'subscription', freq:'monthly', dueDay:+d.day||1, autopay:true, since:today()}); save(); rerender(); toast(`${d.name} is now tracked`); },
  ask: d => ask(d.q || val('ask-q').trim()),
  import: () => runImport(),
  importAdd: () => {
    if (!importFound) return; let nr = 0, nt = 0;
    const p = S.settings.payAmount ? periodOf(today()) : {start:today()};
    importFound.rec.forEach((r,i) => { const c = document.querySelector(`[data-imp="r${i}"]`); if (!c || !c.checked) return; const freq = FREQ[r.freq] ? r.freq : 'monthly';
      const b = {id:uid(), name:String(r.name).slice(0,60), amount:r2(r.amount), type:TYPE[r.type]?r.type:'bill', freq, autopay:true, since:p.start};
      if (freq==='monthly') b.dueDay = Math.min(31, Math.max(1, +r.dueDay||1)); else b.anchor = /^\d{4}-\d{2}-\d{2}$/.test(r.anchor||'') ? r.anchor : today();
      S.bills.push(b); nr++; });
    importFound.tx.forEach((t,i) => { const c = document.querySelector(`[data-imp="t${i}"]`); if (!c || !c.checked) return; S.log.push({id:uid(), date:t.date, amount:r2(t.amount), bucket:BUCKET[t.bucket]?t.bucket:'fun', note:String(t.note||'').slice(0,60), at:Date.now()}); nt++; });
    importFound = null; save(); $('#imp-out').innerHTML = ''; $('#imp-text').value = ''; rerender();
    toast(`Added ${nr} bill${nr===1?'':'s'} and ${nt} entr${nt===1?'y':'ies'}`);
  },
  clearExample: () => { S = normalize({settings:{...S.settings, payAmount:0, essentials:0}}); ui.periodRef = null; save(); renderAll(); openSettings(); },
  resetAll: (d, el) => {
    if (!el.dataset.confirm){ el.dataset.confirm = '1'; el.textContent = 'Tap again to erase all data'; setTimeout(() => { if (el.isConnected){ delete el.dataset.confirm; el.textContent = 'Erase everything'; } }, 3000); return; }
    S = blank(); save(); closeSheet(); renderAll(); toast('Everything erased');
  },
  copyData: (d, el) => {
    const txt = JSON.stringify(S, null, 2);
    navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard')).catch(() => {
      const ta = document.createElement('textarea'); ta.className = 'box'; ta.value = txt; ta.readOnly = true; el.after(ta); ta.select(); toast('Select all and copy');
    });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (!S && el.dataset.act !== 'tab') return;
  const fn = act[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  if (el.dataset.act !== 'pickDate') { /* keep native behaviour for checkboxes inside labels */ }
  fn(el.dataset, el);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'ask-q'){ e.preventDefault(); act.ask({}); } });
routeFromHash();
boot();
})();
</script>
