<title>Paycheque Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one centred column. Dark gradient hero, swipeable account cards, grouped lists, floating tab bar with a sliding highlight and a centre log button. */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --card2:#F0F1F4; --fg:#0E1013; --muted:#686D76; --faint:#A3A7B0;
  --line:rgba(16,18,24,.08); --shadow:0 1px 0 rgba(16,18,24,.03),0 12px 32px -16px rgba(16,18,24,.18);
  --pay:#12A06A; --pay-soft:rgba(18,160,106,.12); --red:#E5484D; --red-soft:rgba(229,72,77,.11);
  --bill:#F08A1C; --sub:#7457E8; --debt:#E0464E; --ess:#3478F0; --save:#0FA0A6; --fun:#E44E8C; --hold:#9AA0AD; --bnpl:#6FA512;
  --bar:rgba(255,255,255,.82); --ink:#0E1013; --on-ink:#FFFFFF; --knob:#FFFFFF;
  --f:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:22px; --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08090B; --card:#14161A; --card2:#1D1F25; --fg:#F4F5F7; --muted:#9A9EA9; --faint:#656974;
  --line:rgba(255,255,255,.08); --shadow:none;
  --pay:#2BD48F; --pay-soft:rgba(43,212,143,.14); --red:#FF5C61; --red-soft:rgba(255,92,97,.16);
  --bill:#FFA041; --sub:#9C86FF; --debt:#FF5C61; --ess:#5C97FF; --save:#2CC8CC; --fun:#FF6FA8; --hold:#6E7380; --bnpl:#A3D84B;
  --bar:rgba(24,26,31,.82); --ink:#F4F5F7; --on-ink:#0E1013; --knob:#FFFFFF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#08090B; --card:#14161A; --card2:#1D1F25; --fg:#F4F5F7; --muted:#9A9EA9; --faint:#656974;
  --line:rgba(255,255,255,.08); --shadow:none;
  --pay:#2BD48F; --pay-soft:rgba(43,212,143,.14); --red:#FF5C61; --red-soft:rgba(255,92,97,.16);
  --bill:#FFA041; --sub:#9C86FF; --debt:#FF5C61; --ess:#5C97FF; --save:#2CC8CC; --fun:#FF6FA8; --hold:#6E7380; --bnpl:#A3D84B;
  --bar:rgba(24,26,31,.82); --ink:#F4F5F7; --on-ink:#0E1013; --knob:#FFFFFF; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;transition:transform .18s var(--ease),background .2s,opacity .2s}
button:active{transform:scale(.97)}
input,select,textarea{font:inherit;color:var(--fg)}
:focus-visible{outline:2px solid var(--ess);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:600px;margin:0 auto;padding-block:8px 150px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:14px 2px 12px}
.top>div:first-child{min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(22px,6vw,30px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em;margin:0}
h3{font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:26px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h3 button{text-transform:none;letter-spacing:0;font-size:14px;color:var(--ess);font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.icon-btn svg{width:20px;height:20px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.save-state{font-size:12px;color:var(--faint);min-height:16px;text-align:center}
[hidden]{display:none!important}

/* view entrance */
.view.enter>*{animation:rise .55s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}
.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(6){animation-delay:.2s}.view.enter>*:nth-child(n+7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{transform:scale(.88)}100%{transform:none}}
.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

.pnav{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:2px}
.pnav button{width:34px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.pnav svg{width:18px;height:18px}

/* hero */
.hero{position:relative;border-radius:28px;padding:22px 20px 18px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,rgba(36,214,152,.30) 0%,transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(116,87,232,.34) 0%,transparent 60%),linear-gradient(160deg,#0C1F1A,#0B1420);
  box-shadow:0 26px 50px -24px rgba(9,40,30,.6)}
.hero .label{font-size:14px;font-weight:600;color:rgba(255,255,255,.72)}
.big{font-size:50px;font-weight:800;letter-spacing:-.04em;line-height:1.04;margin:6px 0 4px}
.big.neg{color:#FF8A8E}
.hero .sub{font-size:13px;color:rgba(255,255,255,.68);max-width:48ch}
.meter{display:flex;height:12px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.12);margin:18px 0 12px;gap:2px}
.meter i{display:block;height:100%;min-width:0;border-radius:3px;transition:flex-basis .7s var(--ease)}
.meter i.hatch{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.55) 0 3px,transparent 3px 6px)!important;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.hero .legend{color:rgba(255,255,255,.72)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.hstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.hstat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:11px 12px;min-width:0}
.hstat span{display:block;font-size:12px;color:rgba(255,255,255,.64)}
.hstat b{display:block;font-size:17px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.stat{background:var(--card);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}

.guard{display:flex;gap:14px;align-items:center;padding:16px 18px;margin-top:12px}
.guard b{font-size:24px;letter-spacing:-.03em}
.guard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.rw{position:relative;flex:none;display:grid;place-items:center}
.rw svg{display:block}
.rw .rl{position:absolute;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.ringc{transition:stroke-dasharray .9s var(--ease)}

/* accounts */
.snap{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:2px 16px 14px;scroll-padding-left:16px}
.snap::-webkit-scrollbar{display:none}
.accs{display:flex;gap:12px;width:max-content}
.acc{width:min(268px,74vw);min-height:150px;border-radius:24px;padding:16px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;scroll-snap-align:start;position:relative;overflow:hidden;box-shadow:0 18px 34px -20px rgba(0,0,0,.5)}
.acc::after{content:"";position:absolute;right:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12)}
.acc .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.8;position:relative;z-index:1}
.acc .n{font-size:17px;font-weight:700;letter-spacing:-.01em;position:relative;z-index:1}
.acc .b{font-size:28px;font-weight:800;letter-spacing:-.035em;position:relative;z-index:1}
.acc .f{font-size:12px;opacity:.9;display:flex;gap:6px;align-items:center;flex-wrap:wrap;position:relative;z-index:1;margin-top:2px}
.acc .pill{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 8px;font-weight:700}
.acc.add{background:var(--card);color:var(--muted);box-shadow:var(--shadow);align-items:center;justify-content:center;gap:8px;width:150px;font-weight:600}
.acc.add::after{display:none}
.acc.add svg{width:26px;height:26px}
.acc-sum{display:flex;justify-content:space-between;align-items:center;padding:0 4px;font-size:13px;color:var(--muted);margin-top:-4px}
.acc-sum b{color:var(--fg);font-size:15px}

/* spend bars */
.bars{display:flex;align-items:flex-end;gap:4px;height:84px;margin-top:14px}
.bars i{flex:1;min-width:0;border-radius:5px 5px 2px 2px;background:var(--card2);transform-origin:bottom;animation:grow .7s var(--ease) both;position:relative}
.bars i.has{background:color-mix(in srgb,var(--fun) 45%,var(--card2))}
.bars i.now{background:var(--fun)}
.bars i.fut{background:transparent;border:1.5px dashed var(--line)}
.bar-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}

/* lists */
.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;position:relative;width:100%;text-align:left;min-height:60px}
.item+.item::before{content:"";position:absolute;top:0;left:62px;right:0;border-top:1px solid var(--line)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.item.done .amt{color:var(--muted)}
.tile{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;transition:all .25s var(--ease)}
.check svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.6,.5,1);color:#fff}
.check.on{background:var(--pay);border-color:var(--pay)}
.check.on svg{opacity:1;transform:none}
.check.over{border-color:var(--red)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.green{background:var(--pay-soft);color:var(--pay)}
.tag.grey{background:var(--card2);color:var(--muted)}
.tag.amber{background:color-mix(in srgb,var(--bill) 16%,transparent);color:var(--bill)}
.empty{padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}

/* buckets */
.bucket{padding:15px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:5px 12px;align-items:center}
.bucket+.bucket{border-top:1px solid var(--line)}
.bucket .name{font-weight:600}
.bucket .prog{grid-column:2/4;height:7px;border-radius:4px;background:var(--card2);overflow:hidden}
.bucket .prog i{display:block;height:100%;border-radius:4px;transition:width .8s var(--ease)}
.bucket .meta{grid-column:2/4;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:3px;gap:2px}
.seg.grid{display:grid;grid-template-columns:1fr 1fr}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;min-width:0}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.scroll-x{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-x::-webkit-scrollbar{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.nowrap{flex-wrap:nowrap}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.chip.on{background:var(--ink);color:var(--on-ink)}
.chip .dot{width:7px;height:7px}

/* goals */
.goal{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.goal+.goal{margin-top:12px}
.goal .gh{display:flex;gap:14px;align-items:center}
.goal .gt{font-size:17px;font-weight:700;letter-spacing:-.015em;min-width:0}
.goal .adv,.adv{background:var(--card2);border-radius:16px;padding:12px 14px}
.adv b{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:3px}
.adv p{margin:0;font-size:13px;color:var(--muted)}
.btns{display:flex;gap:8px}
.btns .btn{flex:1}

/* calendar */
.cal-head{display:flex;align-items:baseline;justify-content:space-between;padding:14px 2px 10px;gap:8px}
.cal-title{white-space:nowrap;font-size:clamp(24px,7vw,31px);font-weight:800;letter-spacing:-.03em}
.cal-title span{color:var(--red)}
.cal-ctrl{display:flex;gap:2px;align-items:center;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:2px}
.cal-ctrl button{height:36px;min-width:36px;padding:0 10px;border-radius:18px;display:grid;place-items:center;color:var(--red);font-weight:600}
.cal-ctrl svg{width:20px;height:20px}
.calcard{padding:12px 8px 10px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);touch-action:pan-y}
.day{padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;position:relative}
.day .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .25s var(--ease),transform .25s var(--ease)}
.day.we .n{color:var(--muted)}
.day.today .n{color:var(--red);font-weight:700}
.day.sel .n{background:var(--ink);color:var(--on-ink);font-weight:700;transform:scale(1.05)}
.day.sel.today .n{background:var(--red);color:#fff}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .paytag{position:absolute;top:2px;right:3px;font-size:9px;font-weight:800;color:var(--pay);letter-spacing:.03em}
.day.inpd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--pay-soft)}
.agenda-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 10px}
.agenda-h b{font-size:18px;letter-spacing:-.02em}
.ev{display:flex;gap:12px;align-items:center;padding:12px 16px;position:relative;min-height:58px;width:100%;text-align:left}
.ev+.ev::before{content:"";position:absolute;top:0;left:30px;right:0;border-top:1px solid var(--line)}
.ev .bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.ev .main{flex:1;min-width:0}
.cal-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}

/* insights */
.ins{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.ins+.ins{border-top:1px solid var(--line)}
.ins .ic{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;flex:none}
.ins .ic svg{width:18px;height:18px}
.ins b{display:block;font-size:15px}
.ins p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.ins .act{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:16px;font-weight:600;font-size:15px;background:var(--card2)}
.btn.primary{background:var(--ink);color:var(--on-ink)}
.btn.green{background:var(--pay);color:#fff}
.btn.danger{color:var(--red);background:var(--red-soft)}
.btn.sm{padding:8px 14px;font-size:13px;border-radius:12px}
.btn.wide{width:100%;padding:15px}
.btn[disabled]{opacity:.5;cursor:default}
.ai-out{font-size:15px;line-height:1.55;margin-top:12px}
.ai-out p{margin:0 0 8px} .ai-out ul{margin:0 0 8px;padding-left:20px} .ai-out li{margin:2px 0}
.ai-out:empty{display:none}
.think{display:inline-flex;gap:4px;align-items:center;color:var(--muted);font-size:14px}
.think i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
textarea.box{width:100%;min-height:110px;border-radius:16px;border:1px solid var(--line);background:var(--card2);padding:12px;resize:vertical;font-size:14px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar .in{pointer-events:auto;position:relative;max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--bar);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border:1px solid var(--line);border-radius:32px;box-shadow:0 18px 40px -14px rgba(0,0,0,.28);padding:6px 4px}
.ind{position:absolute;left:4px;top:6px;bottom:6px;width:calc((100% - 8px)/5);display:grid;place-items:center;transform:translateX(calc(var(--i,0)*100%));transition:transform .5s var(--ease),opacity .3s;pointer-events:none}
.ind::before{content:"";width:68px;max-width:92%;height:100%;border-radius:24px;background:var(--card2)}
.in.none .ind{opacity:0}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:7px 0 6px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--fg)}
.fab{position:relative;z-index:1;justify-self:center;width:56px;height:56px;border-radius:50%;background:linear-gradient(145deg,#1FD08B,#0E9F6E);color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px -6px rgba(14,159,110,.6);transform:translateY(-14px)}
.fab:active{transform:translateY(-14px) scale(.92)}
.fab svg{width:28px;height:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;opacity:0;transition:opacity .3s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:94%;display:flex;justify-content:center;transform:translateY(105%);transition:transform .45s var(--ease)}
.sheet .panel{width:100%;max-width:600px;background:var(--bg);border-radius:30px 30px 0 0;overflow-y:auto;max-height:94vh;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -20px 60px -20px rgba(0,0,0,.4)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--faint);opacity:.5;margin:2px auto 8px}
body.sheet-open .scrim{opacity:1}
body.sheet-open .sheet{transform:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 16px}
.sh-head button{color:var(--ess);font-weight:600;font-size:16px;min-width:64px}
.sh-head button:last-child{text-align:right}
.sh-head b{font-size:17px}
.form{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.field{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.field label{flex:none;min-width:96px;font-weight:500}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;outline:none;font-size:16px}
.field input[type=range]{accent-color:var(--ink)}
.field .unit{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0}
.switch{width:51px;height:31px;border-radius:16px;background:var(--card2);position:relative;flex:none;transition:background .25s;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:var(--knob);box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch.on{background:var(--pay);border-color:var(--pay)}
.switch.on::after{transform:translateX(20px)}
.quick{width:100%;border:0;background:var(--card);border-radius:20px;padding:17px 18px;font-size:19px;font-weight:600;box-shadow:var(--shadow);outline:none}
.quick::placeholder{color:var(--faint);font-weight:500}
.amt-in{display:flex;align-items:baseline;justify-content:center;gap:2px;font-weight:800;font-size:46px;letter-spacing:-.04em;margin:16px 0 6px}
.amt-in input{border:0;background:transparent;outline:none;font:inherit;width:6ch;text-align:left;color:var(--fg);padding:0}
.amt-in span{color:var(--muted)}
.lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:18px 4px 8px}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line)}
.sw.on{border-color:var(--bg);box-shadow:0 0 0 2.5px var(--fg)}
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:18px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;transition:all .35s var(--ease);pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--pay);font-weight:700}
.banner{display:flex;gap:10px;align-items:center;padding:11px 16px;background:var(--card);border-radius:18px;font-size:13px;color:var(--muted);margin:0 0 12px;box-shadow:var(--shadow)}
.banner b{color:var(--fg)}
.banner button{margin-left:auto;color:var(--ess);font-weight:600;white-space:nowrap}
.welcome{padding:26px 20px}
.welcome h2{font-size:26px;margin-bottom:6px;letter-spacing:-.03em}
@media (max-width:420px){.big{font-size:44px}.hstat b{font-size:15px}.day{min-height:54px}.day .n{font-size:16px;width:31px;height:31px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(() => {

  trend:I('<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>',2.2),
  clock:I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',2.2),
  shield:I('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',2.2),
  spark:I('<path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M18 15l.8 2.2L21 18l-2.2.8L18 21l-.8-2.2L15 18l2.2-.8z"/>'),

/* ---------- model ---------- */
const TYPE = { bill:{label:'Bill', c:'--bill'}, subscription:{label:'Subscription', c:'--sub'}, debt:{label:'Debt', c:'--debt'}, bnpl:{label:'Pay in 4', c:'--bnpl'} };
const BUCKET = { fun:{label:'Fun', c:'--fun'}, essential:{label:'Essentials', c:'--ess'}, debt:{label:'Extra debt', c:'--debt'}, save:{label:'Savings', c:'--save'}, income:{label:'Income', c:'--pay'} };
const FREQ = { monthly:'Monthly', biweekly:'Every 2 weeks', weekly:'Weekly', yearly:'Yearly', once:'One time' };
const KIND = { chequing:'Chequing', savings:'Savings', credit:'Credit card', invest:'Investing' };
const GRAD = [['#1E3A8A','#3B82F6'],['#5B21B6','#A78BFA'],['#065F46','#34D399'],['#9F1239','#FB7185'],['#111827','#4B5563'],['#B45309','#FBBF24'],['#9D174D','#F472B6']];
const BANKS = [['KOHO','chequing',1],['Wealthsimple','invest',4],['RBC','chequing',0],['TD','chequing',2],['Scotiabank','chequing',3],['BMO','chequing',0],['CIBC','chequing',3],['Tangerine','savings',5]];
const GOAL_IDEAS = [['Emergency fund',1000],['Trip',2000],['New laptop',1800],['Car repair',800]];
const PROVIDERS = ['Afterpay','Klarna','Affirm','Sezzle','Other'];
const PRESETS = [ {k:'debt', label:'Debt first', s:{debt:70,save:20,fun:10}}, {k:'bal', label:'Balanced', s:{debt:50,save:25,fun:25}}, {k:'breathe', label:'Breathe', s:{debt:30,save:30,fun:40}} ];
const blank = () => ({ v:2, settings:{payAmount:0,payFreq:'biweekly',payAnchor:today(),payAccountId:null,essentials:0,buffer:100,smooth:true,splits:{debt:50,save:25,fun:25}}, bills:[], paid:{}, log:[], accounts:[], goals:[] });

function exampleExtras(o){

  o.accounts = [
    {id:'a-koho',name:'KOHO',kind:'chequing',balance:612.55,color:1},

    {id:'a-td',name:'TD Savings',kind:'savings',balance:2100,color:2},
    {id:'a-ws',name:'Wealthsimple',kind:'invest',balance:5320,color:4}
  ].map(a => ({...a, asOf:'2026-11-05', asOfAt:t0}));
  const map = {rent:'a-rbc',rogers:'a-koho',hydro:'a-rbc',ins:'a-rbc',car:'a-rbc',gym:'a-koho',netflix:'a-koho',spotify:'a-koho',crave:'a-koho',icloud:'a-koho',prime:'a-koho',visa:'a-rbc',osap:'a-rbc'};
  o.bills.forEach(b => { if (map[b.id]) b.accountId = map[b.id]; });
  o.bills.push({id:'ap1',name:'Nike (Afterpay)',type:'bnpl',provider:'Afterpay',freq:'biweekly',anchor:'2026-11-03',count:4,amount:30,total:120,accountId:'a-koho',autopay:true});
  o.paid['ap1|2026-11-03'] = {on:'2026-11-03',amount:30};
  o.settings.payAccountId = 'a-rbc';
  o.log.forEach(e => { if (['e3','e4','e5','e6','e8'].includes(e.id)) e.accountId = 'a-koho'; });
  const sv = o.log.find(e => e.id==='e7'); if (sv){ sv.accountId='a-rbc'; sv.toAccountId='a-td'; sv.goalId='g-emerg'; sv.note='Emergency fund'; }
  o.goals = [
    {id:'g-japan',name:'Japan trip',target:3500,start:0,due:'2027-05-01',kind:'want',accountId:'a-td'},
    {id:'g-mac',name:'New MacBook',target:1800,start:300,due:null,kind:'want',accountId:null},
    {id:'g-emerg',name:'Emergency fund',target:3000,start:400,due:null,kind:'need',accountId:'a-td'}
  ];
}
function normalize(d){
  const b = blank();
  const s = Object.assign(b.settings, d && d.settings || {});
  s.splits = Object.assign({debt:50,save:25,fun:25}, s.splits||{});
  const o = { v:2, example:!!(d&&d.example), settings:s, bills:Array.isArray(d&&d.bills)?d.bills:[], paid:(d&&d.paid&&typeof d.paid==='object')?d.paid:{}, log:Array.isArray(d&&d.log)?d.log:[],
    accounts:Array.isArray(d&&d.accounts)?d.accounts:null, goals:Array.isArray(d&&d.goals)?d.goals:[] };
  if (o.accounts === null){
    o.accounts = [];
    if (o.example && o.bills.some(x=>x.id==='rent') && o.bills.some(x=>x.id==='netflix')) exampleExtras(o);
  }
  return o;
}
let S = null;
const ui = { tab:'period', periodRef:null, calMonth:null, calSel:null, billFilter:'all', lastFree:null, lastAcct:null };

/* occurrences */
function gen(b, from, to){
  const out = []; const F = dnum(from), T = dnum(to);
  if (b.freq === 'monthly'){
    const d = parse(from); let y = d.getFullYear(), m = d.getMonth();
    for (let guard=0; guard<400; guard++){
      const day = Math.min(+b.dueDay||1, dim(y,m)); const s = `${y}-${pad(m+1)}-${pad(day)}`; const n = dnum(s);
      if (n > T) break; if (n >= F) out.push(s);
      if (++m > 11){ m = 0; y++; }
    }
  } else if (b.freq === 'weekly' || b.freq === 'biweekly'){
    const step = b.freq === 'weekly' ? 7 : 14; const A = dnum(b.anchor || from);
    for (let n = A + Math.ceil((F-A)/step)*step; n <= T; n += step) out.push(fromNum(n));
  } else if (b.freq === 'yearly'){
    const a = parse(b.anchor || from);
    for (let y = parse(from).getFullYear(); y <= parse(to).getFullYear(); y++){
      const s = `${y}-${pad(a.getMonth()+1)}-${pad(Math.min(a.getDate(), dim(y,a.getMonth())))}`; const n = dnum(s);
      if (n >= F && n <= T) out.push(s);
    }

    if (b.anchor && dnum(b.anchor) >= F && dnum(b.anchor) <= T) out.push(b.anchor);
  }

function allBnpl(b){ return gen(b, b.anchor, addDays(b.anchor, 45*(b.count||4)+7)).slice(0, b.count||4); }
function occ(b, from, to){
  if (!b || b.paused) return [];
  if (b.count && b.anchor) return allBnpl(b).filter(d => d >= from && d <= to);
  const out = gen(b, from, to);
  return b.since ? out.filter(s => s >= b.since) : out;
}
function bnplInfo(b){
  const list = allBnpl(b), key = d => b.id+'|'+d;
  const paid = list.filter(d => S.paid[key(d)]).length;

  return {list, paid, count:list.length, next, left: r2((list.length-paid)*b.amount), done: paid >= list.length};
}
const perMonth = b => b.type==='bnpl' ? 0 : b.freq==='monthly'?+b.amount : b.freq==='biweekly'?b.amount*26/12 : b.freq==='weekly'?b.amount*52/12 : b.freq==='yearly'?b.amount/12 : 0;
const periodsPerMonth = () => { const f=S.settings.payFreq; return f==='weekly'?52/12:f==='biweekly'?26/12:f==='semimonthly'?2:1; };
const payPerMonth = () => S.settings.payAmount*periodsPerMonth();
const stepDays = () => { const f=S.settings.payFreq; return f==='weekly'?7:f==='biweekly'?14:f==='semimonthly'?15.2:30.4; };

function periodOf(d){
  const s = S.settings;
  if (s.payFreq === 'semimonthly'){ const x=parse(d), y=x.getFullYear(), m=x.getMonth();
    return x.getDate() < 15 ? {start:`${y}-${pad(m+1)}-01`, end:`${y}-${pad(m+1)}-14`} : {start:`${y}-${pad(m+1)}-15`, end:`${y}-${pad(m+1)}-${pad(dim(y,m))}`}; }
  if (s.payFreq === 'monthly'){ const x=parse(d), y=x.getFullYear(), m=x.getMonth(); return {start:`${y}-${pad(m+1)}-01`, end:`${y}-${pad(m+1)}-${pad(dim(y,m))}`}; }
  const step = s.payFreq === 'weekly' ? 7 : 14; const A = dnum(s.payAnchor || today()); const N = dnum(d);
  const st = A + Math.floor((N-A)/step)*step; return {start:fromNum(st), end:fromNum(st+step-1)};
}
const nextPeriod = p => periodOf(addDays(p.end,1));
const prevPeriod = p => periodOf(addDays(p.start,-1));
const isPayday = d => S.settings.payAmount > 0 && periodOf(d).start === d;
function paydays(after, upto){
  const out = []; let p = periodOf(after), g = 0;
  if (p.start <= after) p = nextPeriod(p);
  while (p.start <= upto && g++ < 400){ out.push(p.start); p = nextPeriod(p); }
  return out;
}

function periodItems(p){
  const items = [];
  for (const b of S.bills) for (const d of occ(b,p.start,p.end)){
    const key = b.id+'|'+d, rec = S.paid[key];
    items.push({b, date:d, key, paid:!!rec, paidOn:rec&&rec.on, amount: rec&&rec.amount!=null ? +rec.amount : +b.amount});
  }
  return items.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.b.name.localeCompare(b.b.name));
}
function stats(p){
  const items = periodItems(p);
  const logs = S.log.filter(e => inRange(e.date,p));
  const spent = {fun:0,essential:0,debt:0,save:0};
  let extra = 0;
  for (const e of logs){ if (e.bucket==='income') extra += +e.amount; else spent[e.bucket] = (spent[e.bucket]||0) + (+e.amount); }
  const income = S.settings.payAmount + extra;
  const billsTotal = sum(items, i=>i.amount), billsPaid = sum(items.filter(i=>i.paid), i=>i.amount);
  return {p, items, logs, spent, extra, income, billsTotal, billsPaid, billsLeft: billsTotal-billsPaid};
}
function plan(p){
  const st = stats(p), s = S.settings;
  const nx = stats(nextPeriod(p));
  const nextNeed = nx.billsTotal + s.essentials + s.buffer - s.payAmount;
  const hold = s.smooth ? Math.max(0, nextNeed) : 0;
  const essUse = Math.max(st.spent.essential, s.essentials);
  const free = st.income - st.billsTotal - essUse - s.buffer - hold;
  const fp = Math.max(0, free);
  const sp = s.splits, tot = (sp.debt+sp.save+sp.fun)||1;
  const alloc = {debt:fp*sp.debt/tot, save:fp*sp.save/tot, fun:fp*sp.fun/tot};
  const left = {debt:alloc.debt-st.spent.debt, save:alloc.save-st.spent.save, fun:alloc.fun-st.spent.fun};
  const spentAll = st.spent.fun+st.spent.essential+st.spent.debt+st.spent.save;
  const cash = st.income - st.billsPaid - spentAll;
  const mustKeep = st.billsLeft + Math.max(0, s.essentials-st.spent.essential) + s.buffer + hold + Math.max(0,left.debt) + Math.max(0,left.save);
  const safeFun = Math.max(0, Math.min(left.fun, cash - mustKeep));
  return {...st, nx, hold, nextNeed, essUse, free, alloc, left, cash, safeFun, spentAll};
}
function overdue(){
  const t = today(), from = addDays(t,-60), to = addDays(t,-1);
  const out = [];
  for (const b of S.bills) for (const d of occ(b,from,to)) if (!S.paid[b.id+'|'+d]) out.push({b, date:d, key:b.id+'|'+d, amount:+b.amount});
  return out.sort((a,b)=>a.date<b.date?-1:1);
}

/* accounts */
const acct = id => S.accounts.find(a => a.id === id);
function acctBalance(a){
  let bal = +a.balance || 0;
  const cnt = (date, at) => date > a.asOf || (date === a.asOf && (at||0) > (a.asOfAt||0));
  for (const [k, rec] of Object.entries(S.paid)){
    const b = S.bills.find(x => x.id === k.split('|')[0]);
    if (b && b.accountId === a.id && rec.on && cnt(rec.on, rec.at)) bal -= +rec.amount;
  }
  for (const e of S.log){
    if (e.accountId === a.id && cnt(e.date, e.at)) bal += e.bucket==='income' ? +e.amount : -e.amount;
    if (e.toAccountId === a.id && e.bucket !== 'income' && cnt(e.date, e.at)) bal += +e.amount;
  }
  if (S.settings.payAccountId === a.id && S.settings.payAmount > 0) bal += paydays(a.asOf, today()).length * S.settings.payAmount;
  return r2(bal);
}
const acctDue = (a, P) => sum(P.items.filter(i => !i.paid && i.b.accountId === a.id), i => i.amount);
const acctName = id => { const a = id && acct(id); return a ? a.name : ''; };

/* goals */
const goalSaved = g => r2((+g.start||0) + sum(S.log.filter(e => e.goalId === g.id), e => e.amount));
function goalAdvice(g, P){
  const saved = goalSaved(g), remaining = Math.max(0, g.target - saved), t = today(), sd = stepDays();
  const out = {saved, remaining, pct: g.target>0 ? Math.min(1, saved/g.target) : 0};
  if (remaining <= 0.004){ out.done = true; out.verdict = 'done'; out.headline = 'Goal reached'; out.detail = 'You have the full amount. Time to spend it.'; return out; }
  const active = S.goals.filter(x => goalSaved(x) < x.target - 0.004);
  const pool = P.alloc.save;
  const days = g.due ? dnum(g.due) - dnum(t) : null;
  const perOf = x => { if (!x.due) return 0; const d = dnum(x.due)-dnum(t); return Math.max(0, x.target-goalSaved(x)) / Math.max(1, Math.ceil((d+1)/sd)); };
  const periods = days != null ? Math.max(1, Math.ceil((days+1)/sd)) : null;
  const perPeriod = periods ? r2(remaining/periods) : null;
  const othersNeed = sum(active.filter(x => x.id !== g.id), perOf);
  const avail = Math.max(0, pool - othersNeed);
  const share = active.length ? pool/active.length : pool;
  const pace = g.due ? avail : share;
  const etaP = pace > 0.5 ? Math.ceil(remaining/pace) : null;
  const eta = etaP != null ? addDays(t, Math.round(etaP*sd)) : null;
  Object.assign(out, {perPeriod, periods, pace:r2(pace), eta, days});
  const debts = S.bills.filter(b => b.type==='debt' && +b.balance>0 && (+b.apr||0) >= 12).sort((a,b) => (+b.apr||0)-(+a.apr||0));
  const top = debts[0], soon = days != null && days <= 84;
  const tail = perPeriod != null
    ? `Put aside ${money(perPeriod)} each paycheque to have it by ${fmtShort(g.due)}.${perPeriod > avail + 0.5 ? ` Your savings bucket only has ${money(avail)} free for this, so raise savings in your split${eta?` or expect ${fmtMonYr(eta)}`:''}.` : ''}`
    : (eta ? `At your savings pace of ${money(pace)} per paycheque you'd get there around ${fmtMonYr(eta)}.` : 'There is no savings money free right now, so raise the savings share in your split.');
  if (g.kind === 'need' || soon || !top){
    out.verdict = 'now'; out.tone = 'green'; out.headline = 'Save for it now';
    out.suggest = perPeriod != null ? perPeriod : r2(Math.min(pace, remaining));
    out.detail = (g.kind==='need' ? 'This is a need, so it comes before extra debt payments. ' : soon ? `It's due in about ${Math.max(1,Math.round(days/7))} weeks, so waiting would put it at risk. ` : 'You have no expensive debt, so saving now is the right move. ') + tail;
  } else {
    const interest = r2(top.balance*(+top.apr||0)/1200);
    const po = payoff(S.bills.filter(b=>b.type==='debt'&&+b.balance>0), P.alloc.debt*periodsPerMonth());
    const free = po.months !== Infinity ? addDays(t, po.months*30) : null;
    out.verdict = 'later'; out.tone = 'amber'; out.headline = 'Pay debt first, then save';
    out.suggest = r2(Math.min(pace, remaining)*0.2);
    out.detail = `${top.name} costs about ${money(interest)} a month in interest at ${+top.apr||0}%. Savings won't earn that, so extra money does more on the debt.${free?` Start this goal around ${fmtMonYr(free)}.`:''} Want to keep it moving? A small ${money(out.suggest)} per paycheque is fine.`;
  }
  return out;
}

const LS = 'paycheque-planner-v1';
let store = 'local', dbDoc = null, saveTimer = null;
const lsGet = () => { try { const v = localStorage.getItem(LS); return v ? JSON.parse(v) : null; } catch { return null; } };
const lsSet = v => { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} };
const withTimeout = (pr, ms, v) => Promise.race([pr, new Promise(r => setTimeout(() => r(v), ms))]);

  clearTimeout(saveTimer); setSaveState('Saving…');

    const data = JSON.parse(JSON.stringify(S));
    if (store === 'db' && dbDoc){
      try { await dbDoc.set(data); setSaveState('Saved'); }
      catch (e) { lsSet(data); setSaveState('Saved on this device only'); }

async function boot(){
  renderAll();
  let db = null;
  try { if (window.claude && window.claude.use) db = await withTimeout(window.claude.use('db'), 11000, null); } catch { db = null; }

/* ---------- render: Calendar ---------- */
function monthEvents(y, m){
  const start = `${y}-${pad(m+1)}-01`, end = `${y}-${pad(m+1)}-${pad(dim(y,m))}`;
  const map = {};
  const get = d => map[d] || (map[d] = {bills:[], logs:[]});
  for (const b of S.bills) for (const d of occ(b,start,end)){ const k=b.id+'|'+d, rec=S.paid[k]; get(d).bills.push({b, date:d, key:k, paid:!!rec, paidOn:rec&&rec.on, amount: rec&&rec.amount!=null?+rec.amount:+b.amount}); }
  for (const e of S.log) if (e.date >= start && e.date <= end) get(e.date).logs.push(e);
  return {map, start, end};
}
function renderCalendar(){

  const [y, m] = ui.calMonth.split('-').map(Number), mi = m-1;

function shiftMonth(k){ let [y,m] = ui.calMonth.split('-').map(Number); m += k; if (m>12){m=1;y++;} if (m<1){m=12;y--;} ui.calMonth = `${y}-${pad(m)}`; renderCalendar(); }

function monthsOut(n){ const d = new Date(); d.setMonth(d.getMonth()+n); const y = Math.floor(n/12), mo = n%12; return `${MON[d.getMonth()]} ${d.getFullYear()} (${y?`${y}y `:''}${mo}m)`; }
function payoff(debts, extra){
  const ds = debts.map(d => ({bal:+d.balance||0, r:(+d.apr||0)/1200, min:perMonth(d)}));
  let interest = 0;
  for (let m=1; m<=600; m++){
    let pool = extra;
    for (const d of ds){
      if (d.bal <= 0.005){ pool += d.min; continue; }
      const i = d.bal*d.r; interest += i; d.bal += i;
      const pay = Math.min(d.min, d.bal); d.bal -= pay; pool += d.min - pay;
    }
    for (const d of ds.slice().sort((a,b)=>b.r-a.r)){ if (d.bal > 0.005 && pool > 0){ const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; } }
    if (ds.every(d => d.bal <= 0.005)) return {months:m, interest};
  }
  return {months:Infinity, interest};
}

/* ---------- render: Insights ---------- */
function detectRecurring(){
  const groups = {};
  for (const e of S.log){ if (e.bucket==='income' || !e.note) continue; const k = e.note.toLowerCase().replace(/[^a-z+ ]/g,'').trim(); if (k.length<3) continue; (groups[k] = groups[k]||[]).push(e); }
  const known = S.bills.map(b => b.name.toLowerCase());
  const out = [];
  for (const [k, es] of Object.entries(groups)){
    const months = new Set(es.map(e=>e.date.slice(0,7)));
    if (months.size < 2) continue;
    const amts = es.map(e=>+e.amount), avg = sum(amts)/amts.length;
    if (amts.some(a => Math.abs(a-avg) > avg*.12)) continue;
    if (known.some(n => n.includes(k) || k.includes(n))) continue;
    const last = es.slice().sort((a,b)=>a.date<b.date?1:-1)[0];
    out.push({name:last.note, amount:r2(avg), day:parse(last.date).getDate(), count:es.length});
  }
  return out;
}
function insights(){
  const out = [], t = today();
  if (!S.settings.payAmount) return [{c:'--ess', i:ICON.alert, t:'Add your paycheque', d:'Insights need to know what you get paid and when.', a:`<button class="btn sm primary" data-act="settings">Set up paycheque</button>`}];
  const p = periodOf(t), P = plan(p), s = S.settings;
  const od = overdue();
  if (od.length) out.push({c:'--red', i:ICON.alert, t:`${od.length} bill${od.length>1?'s':''} not marked paid`, d:`${od.slice(0,3).map(o=>`${o.b.name} (${fmtShort(o.date)})`).join(', ')}${od.length>3?' and more':''}. If you already paid, tick them off so the math stays right.`, a:`<button class="btn sm" data-act="tab" data-v="period">Review</button>`});
  for (const a of S.accounts.filter(a => a.kind==='chequing' || a.kind==='savings')){
    const due = acctDue(a, P), bal = acctBalance(a);
    if (due > 0 && bal < due) out.push({c:'--red', i:ICON.bank, t:`${a.name} is short ${money(due-bal)} this paycheque`, d:`It has ${money(bal)} but ${money(due)} in unpaid bills comes out of it. Move money in before the first one lands.`});
  }
  const soon = P.items.filter(i => !i.paid && i.date >= t && dnum(i.date)-dnum(t) <= 3);
  if (soon.length) out.push({c:'--bill', i:ICON.clock, t:`Due in the next 3 days: ${money(sum(soon,i=>i.amount))}`, d:soon.map(i=>`${i.b.name} ${fmtDow(i.date)}${i.b.autopay?' (autopay)':''}`).join(', ')+'.'});
  const plans = S.bills.filter(b=>b.type==='bnpl').map(b=>({b, n:bnplInfo(b)})).filter(x=>!x.n.done);
  if (plans.length) out.push({c:'--bnpl', i:ICON.repeat, t:`${money(sum(plans,x=>x.n.left))} still owed on Pay in 4`, d:`${plans.map(x=>`${x.b.name} (${x.n.count-x.n.paid} left)`).join(', ')}. Each payment lands in the paycheque it's due, so more plans means less free money. Finish these before adding another.`});
  if (P.nextNeed > 0) out.push({c:'--hold', i:ICON.shield, t:`Next paycheque is short by ${money(P.nextNeed)}`, d:`${fmtShort(P.nx.p.start)} – ${fmtShort(P.nx.p.end)} has ${money(P.nx.billsTotal)} in bills${P.nx.items.some(i=>i.amount>=s.payAmount*.4)?` (${P.nx.items.filter(i=>i.amount>=s.payAmount*.4).map(i=>i.b.name).join(', ')} lands there)`:''}. ${s.smooth?`The planner is already holding ${money(P.hold)} back from this one so you don't get caught.`:'Turn on "Hold for next paycheque" in settings so this one covers the gap.'}`});
  else if (P.nx.billsTotal < s.payAmount*.25) out.push({c:'--pay', i:ICON.trend, t:'Light paycheque ahead', d:`Only ${money(P.nx.billsTotal)} in bills next period. Good time to push extra at debt or a goal.`});
  const elapsed = Math.min(1, (dnum(t)-dnum(p.start)+1)/(dnum(p.end)-dnum(p.start)+1));
  if (P.alloc.fun > 0 && P.spent.fun > P.alloc.fun*elapsed*1.15 && P.spent.fun > 20) out.push({c:'--fun', i:ICON.trend, t:'Fun spending is running ahead', d:`${Math.round(P.spent.fun/P.alloc.fun*100)}% of fun money gone with ${Math.round(elapsed*100)}% of the pay period done. At this pace you run out around ${fmtShort(addDays(p.start, Math.floor((dnum(p.end)-dnum(p.start)+1)*Math.min(1,P.alloc.fun/P.spent.fun*elapsed))))}.`});
  else if (P.spent.fun > P.alloc.fun && P.spent.fun > 0) out.push({c:'--fun', i:ICON.alert, t:`Fun is over by ${money(P.spent.fun-P.alloc.fun)}`, d:'That came out of debt or savings money. Next paycheque, try the "Breathe" split or log essentials separately so fun is not hiding them.'});
  for (const g of S.goals){ const a = goalAdvice(g, P); if (a.done) continue;
    if (a.verdict==='now' && a.perPeriod != null && a.perPeriod > a.pace + 0.5) out.push({c:'--save', i:ICON.target, t:`${g.name} is behind schedule`, d:`It needs ${money(a.perPeriod)} per paycheque to land by ${fmtShort(g.due)}, but only ${money(a.pace)} of savings is free for it.`, a:`<button class="btn sm" data-act="tab" data-v="goals">See goal</button>`}); }

  if (subs.length){ const yr = sum(subs,perMonth)*12; const top = subs.slice().sort((a,b)=>perMonth(b)-perMonth(a)).slice(0,3);
    out.push({c:'--sub', i:ICON.repeat, t:`${subs.length} subscriptions cost ${money0(yr)} a year`, d:`Biggest: ${top.map(b=>`${b.name} ${money(perMonth(b))}/mo`).join(', ')}. Cancelling one you barely use is the easiest raise you'll get.`}); }
  for (const r of detectRecurring().slice(0,3)) out.push({c:'--sub', i:ICON.repeat, t:`Looks like a subscription: ${r.name}`, d:`You've logged about ${money(r.amount)} ${r.count} times in different months. Track it as a subscription so it's planned, not a surprise.`, a:`<button class="btn sm primary" data-act="addDetected" data-name="${esc(r.name)}" data-amt="${r.amount}" data-day="${r.day}">Add as subscription</button>`});
  const inc = payPerMonth();
  if (inc) out.push({c:'--ess', i:ICON.shield, t:`Bills take ${Math.round(sum(S.bills,perMonth)/inc*100)}% of your pay`, d:`${money0(sum(S.bills,perMonth))} of about ${money0(inc)} a month. ${sum(S.bills,perMonth)/inc>.6?'Above 60% leaves very little room. Debt payoff or a cheaper big bill will help more than cutting coffee.':'That leaves healthy room to plan.'}`});
  const debts = S.bills.filter(b=>b.type==='debt'&&+b.balance>0);
  if (debts.length){ const top = debts.slice().sort((a,b)=>(+b.apr||0)-(+a.apr||0))[0];
    out.push({c:'--debt', i:ICON.trend, t:`Extra debt money goes to ${top.name} first`, d:`At ${+top.apr||0}% it's your most expensive debt. Every extra dollar there saves the most interest.`}); }
  return out;
}

const KW = {
  income:/\b(got paid|paycheque|paycheck|refund|cash ?back|e-?transfer from|sold|bonus|tips?|side gig|income|received|deposit)\b/,
  save:/\b(save|saving|savings|tfsa|rrsp|fhsa|emergency fund|invest|wealthsimple|questrade)\b/,
  debt:/\b(debt|credit card|visa|mastercard|amex|loan|line of credit|osap|extra payment)\b/,
  essential:/\b(grocer\w*|costco|walmart|no ?frills|loblaws|metro|sobeys|food basics|freshco|superstore|gas|petro|esso|shell|pioneer|ultramar|pharmacy|shoppers|rexall|presto|transit|ttc|parking|laundry|doctor|dentist|meds?|medication|toiletries|diapers|hydro)\b/,
  fun:/\b(coffee|starbucks|tim ?hortons|timmies|uber ?eats|doordash|skip|restaurant|bar|pub|beer|wine|lcbo|movies?|cineplex|concert|games?|steam|playstation|xbox|shopping|amazon|clothes|shoes|takeout|lunch|dinner|brunch|mcdonald'?s|pizza|sushi|date|gift|drinks?|club|tickets?)\b/
};
const BNPL_RE = /\b(afterpay|after pay|klarna|affirm|sezzle|pay in 4|pay in four)\b/i;
function parseLog(text){
  const s = text.toLowerCase(), r = {};
  const m = s.match(/\$?\s*(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?/);
  let note = text;
  if (m){ r.amount = parseFloat(m[1].replace(/,/g,'') + '.' + (m[2]||'0')); note = note.replace(m[0].trim(), ' '); }
  if (/\byesterday\b/.test(s)){ r.date = addDays(today(),-1); note = note.replace(/\byesterday\b/i,' '); }
  else if (/\btoday\b/.test(s)) note = note.replace(/\btoday\b/i,' ');
  const bp = text.match(BNPL_RE);
  if (bp){ const w = bp[1].toLowerCase(); r.bnpl = w.includes('afterpay')||w==='after pay' ? 'Afterpay' : w==='klarna'?'Klarna':w==='affirm'?'Affirm':w==='sezzle'?'Sezzle':'Other'; note = note.replace(BNPL_RE,' '); }
  for (const k of ['income','save','debt','essential','fun']) if (KW[k].test(s)){ r.bucket = k; break; }
  note = note.replace(/^\s*(i\s+)?(spent|paid|bought|got|for|on|at|with|using)\s+/i,'').replace(/\s+(on|at|for|with)\s*$/i,'').replace(/\s{2,}/g,' ').trim();
  r.note = note ? note.charAt(0).toUpperCase() + note.slice(1) : '';
  const cands = [...overdue(), ...periodItems(periodOf(today())).filter(i=>!i.paid)];
  const words = s.split(/[^a-z0-9]+/).filter(w=>w.length>=3);
  const hit = !bp && cands.find(c => { const n = c.b.name.toLowerCase(); return s.includes(n) || n.split(/[^a-z0-9]+/).some(w => w.length>=4 && words.includes(w)); });
  if (hit) r.bill = hit;
  return r;
}

    <div class="sh-head"><button data-act="closeSheet">Cancel</button><b>${isNew?'New account':'Edit account'}</b><button data-act="saveAcct" data-id="${esc(a.id)}" data-new="${isNew?1:0}" style="font-weight:700">${isNew?'Add':'Save'}</button></div>

/* ---------- Claude ---------- */
async function getSample(){ try { return window.claude && window.claude.use ? await withTimeout(window.claude.use('sample'), 11000, null) : null; } catch { return null; } }
function mdLite(t){
  const lines = esc(noDash(t)).split(/\n/); let html = '', inList = false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^#{1,4}\s*(.+)$/,'<strong>$1</strong>');
    if (/^\s*[-*•]\s+/.test(l)){ if (!inList){ html += '<ul>'; inList = true; } html += `<li>${l.replace(/^\s*[-*•]\s+/,'')}</li>`; }
    else { if (inList){ html += '</ul>'; inList = false; } if (l.trim()) html += `<p>${l}</p>`; }
  }
  return html + (inList ? '</ul>' : '');
}
function summary(){
  const t = today(), p = periodOf(t), P = plan(p);
  return {
    today: t, currency:'CAD', payFrequency:S.settings.payFreq, takeHomePay:S.settings.payAmount,
    accounts: S.accounts.map(a => ({name:a.name, type:a.kind, balance:acctBalance(a), dueThisPaycheque:r2(acctDue(a,P))})),
    goals: S.goals.map(g => { const a = goalAdvice(g,P); return {name:g.name, target:g.target, saved:a.saved, neededBy:g.due||null, kind:g.kind, suggestedPerPaycheque:a.perPeriod, appVerdict:a.headline}; }),
    currentPayPeriod:{start:p.start, end:p.end, income:r2(P.income), billsTotal:r2(P.billsTotal), billsPaid:r2(P.billsPaid), billsStillToPay:r2(P.billsLeft),
      bills:P.items.map(i=>({name:i.b.name, due:i.date, amount:i.amount, paid:i.paid, type:i.b.type, account:acctName(i.b.accountId)||undefined})),
      essentialsBudget:S.settings.essentials, buffer:S.settings.buffer, heldForNextPaycheque:r2(P.hold), freeToPlan:r2(P.free),
      plan:{debt:r2(P.alloc.debt), savings:r2(P.alloc.save), fun:r2(P.alloc.fun)}, spentSoFar:{fun:r2(P.spent.fun), essentials:r2(P.spent.essential), extraDebt:r2(P.spent.debt), savings:r2(P.spent.save)},
      cashOnHand:r2(P.cash), safeToSpendOnFunNow:r2(P.safeFun)},
    nextPayPeriod:{start:P.nx.p.start, end:P.nx.p.end, billsTotal:r2(P.nx.billsTotal), bills:P.nx.items.map(i=>({name:i.b.name, due:i.date, amount:i.amount}))},
    overdueUnmarked: overdue().map(o=>({name:o.b.name, due:o.date, amount:o.amount})),
    allRecurring: S.bills.map(b=>({name:b.name, type:b.type, frequency:b.freq, amount:+b.amount, perMonth:r2(perMonth(b)), balance:b.balance!=null?+b.balance:undefined, aprPercent:b.apr!=null?+b.apr:undefined, payInFourLeft:b.type==='bnpl'?bnplInfo(b).left:undefined})),
    recentSpending: S.log.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,40).map(e=>({date:e.date, amount:+e.amount, note:e.note, kind:e.bucket}))
  };
}
async function ask(q, outSel='#ai-out'){
  const out = $(outSel); if (!q){ const i = $('#ask-q'); i && i.focus(); return; }
  out.innerHTML = '<div class="think"><i></i><i></i><i></i>&nbsp;Thinking…</div>';
  const sample = await getSample();
  if (!sample){ out.innerHTML = '<p class="muted">Claude isn\'t available in this view. Open this page on claude.ai while signed in to use it.</p>'; return; }
  const prompt = `You are a direct, practical money coach for one person in Canada. All amounts are Canadian dollars. They tend to mix fun spending with important spending, so protect bills, essentials, debt and savings first.
Here is their data as JSON:
${JSON.stringify(summary())}

Their question: ${q}

Rules: answer in under 170 words. Use the real numbers from the data. Start with the single most useful sentence. Then short bullet points starting with "- ". Use **bold** for key amounts. Plain words, no jargon. Never use em dashes or en dashes.`;
  try {
    await sample(prompt, { modelTier:'default', onText: ({text}) => { out.innerHTML = mdLite(text); } }).then(r => { out.innerHTML = mdLite(r.text); });
  } catch (e) {
    out.innerHTML = e && e.code === 'not_granted' ? '<p class="muted">Claude access was declined for this page. You can allow it from the artifact\'s permissions menu.</p>' : e && e.code === 'rate_limited' ? '<p class="muted">Claude is busy for you right now. Try again in a minute.</p>' : `<p class="muted">That didn't go through${e&&e.message?`: ${esc(e.message)}`:''}. Try again.</p>`;
  }
}
let importFound = null;
async function runImport(){
  const text = val('imp-text').trim(), out = $('#imp-out');
  if (text.length < 10){ $('#imp-text').focus(); return; }
  out.innerHTML = '<div class="think"><i></i><i></i><i></i>&nbsp;Reading your transactions…</div>';
  const sample = await getSample();
  if (!sample){ out.innerHTML = '<p class="small muted">Claude isn\'t available in this view. Open this page on claude.ai while signed in.</p>'; return; }
  const prompt = `Extract personal finance data from these bank transactions. Today is ${today()}. Amounts are CAD. Years missing means the most recent past date.
Existing tracked bills (do not repeat these as recurring): ${JSON.stringify(S.bills.map(b=>b.name))}

Transactions:
"""
${text.slice(0,12000)}
"""

Return JSON only, this shape:
{"recurring":[{"name":"Netflix","amount":18.99,"type":"subscription|bill|debt","freq":"monthly|biweekly|weekly|yearly","dueDay":3,"anchor":"YYYY-MM-DD"}],
 "transactions":[{"date":"YYYY-MM-DD","amount":12.5,"note":"Short clean merchant name","bucket":"fun|essential|debt|save|income"}]}
Rules: recurring = things that clearly repeat on a schedule (rent, phone, insurance, streaming, gym, loan payments). Put a recurring charge only in "recurring", not in "transactions". "essential" = groceries, gas, transit, pharmacy. "fun" = restaurants, takeout, coffee, shopping, entertainment. Deposits are "income". Positive numbers only.`;
  try {
    const data = await sample.json(prompt, { modelTier:'default' });
    const rec = Array.isArray(data && data.recurring) ? data.recurring.filter(x=>x&&x.name&&+x.amount>0) : [];
    const tx = Array.isArray(data && data.transactions) ? data.transactions.filter(x=>x&&+x.amount>0&&/^\d{4}-\d{2}-\d{2}$/.test(x.date||'')) : [];
    importFound = {rec, tx};
    if (!rec.length && !tx.length){ out.innerHTML = '<p class="small muted">Nothing usable found. Paste lines that include a date, a description and an amount.</p>'; return; }
    out.innerHTML = `
      ${rec.length?`<div class="lbl">Recurring bills found</div><div class="list">${rec.map((r,i)=>`<label class="item"><input type="checkbox" checked data-imp="r${i}" style="width:20px;height:20px;accent-color:var(--pay)"><div class="main"><div class="t">${esc(r.name)}</div><div class="s">${esc((TYPE[r.type]||TYPE.bill).label)} · ${esc(FREQ[r.freq]||'Monthly')}${r.freq==='monthly'||!r.freq?` on the ${ordinal(+r.dueDay||1)}`:''}</div></div><div class="amt">${money(r.amount)}</div></label>`).join('')}</div>`:''}
      ${tx.length?`<div class="lbl">Spending and income</div><div class="list">${tx.map((t,i)=>`<label class="item"><input type="checkbox" checked data-imp="t${i}" style="width:20px;height:20px;accent-color:var(--pay)"><div class="main"><div class="t">${esc(t.note||'Purchase')}</div><div class="s">${esc((BUCKET[t.bucket]||BUCKET.fun).label)} · ${fmtDow(t.date)}</div></div><div class="amt">${money(t.amount)}</div></label>`).join('')}</div>`:''}
      <button class="btn green wide" style="margin-top:12px" data-act="importAdd">Add selected</button>`;
  } catch (e) {
    out.innerHTML = `<p class="small muted">${e && e.code==='not_granted' ? 'Claude access was declined for this page.' : e && e.code==='rate_limited' ? 'Claude is busy right now. Try again in a minute.' : "Couldn't read that. Try a shorter paste."}</p>`;
  }
}

/* ---------- actions ---------- */
function createBnpl({name, total, date, provider, accountId, count=4, paidN=1, every='biweekly'}){
  const b = {id:uid(), name, type:'bnpl', provider, freq:every, anchor:date, count, amount:r2(total/count), total:r2(total), accountId:accountId||'', autopay:true};
  if (every==='monthly') b.dueDay = parse(date).getDate();
  S.bills.push(b);
  allBnpl(b).slice(0, paidN).forEach(d => { S.paid[b.id+'|'+d] = {on:d, amount:b.amount, at:Date.now()}; });
  return b;
}
const act = {
  tab: d => { ui.tab = d.v; try { history.replaceState(null,'','#'+d.v); } catch { location.hash = d.v; } syncTabs(); rerender(); enter(); window.scrollTo({top:0}); },
  log: d => openLog({date:d.date}),
  closeSheet: () => closeSheet(),
  settings: () => openSettings(),
  newBill: () => openBill(null),
  editBill: d => openBill(S.bills.find(b => b.id === d.id)),
  newAcct: () => openAccount(null),
  acctPreset: d => openAccount(null, BANKS.find(b => b[0]===d.n)),
  acctFill: d => { $('#a-name').value = d.n; $('#a-kind').value = d.k; document.querySelectorAll('[data-seg="a-kind"] button').forEach(b => b.classList.toggle('on', b.dataset.v===d.k)); act.pickColor({c:d.c}); const l = $('#a-ballbl'); if (l) l.textContent = d.k==='credit'?'Amount owed':'Balance'; },
  editAcct: d => openAccount(acct(d.id)),
  pickColor: d => { $('#a-color').value = d.c; document.querySelectorAll('.sw').forEach(s => s.classList.toggle('on', s.dataset.c===String(d.c))); },
  saveAcct: d => {
    const name = val('a-name').trim(), v = num('a-bal'), kind = val('a-kind');

    const shown = isNaN(v) ? 0 : v, signed = kind==='credit' ? -Math.abs(shown) : shown;

    if (changed){ a.balance = r2(signed); a.asOf = today(); a.asOfAt = Date.now(); }
    if (fresh && !S.settings.payAccountId && kind==='chequing') S.settings.payAccountId = a.id;
    save(); closeSheet(); rerender(); toast(fresh ? `${name} added` : `${name} saved`);
  },
  delAcct: (d, el) => {
    if (!el.dataset.confirm){ el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if (el.isConnected){ delete el.dataset.confirm; el.textContent = 'Delete account'; } }, 3000); return; }
    const a = acct(d.id); S.accounts = S.accounts.filter(x => x.id !== d.id);

  },
  newGoal: () => openGoal(null),
  goalPreset: d => openGoal(null, [d.n, +d.t]),
  editGoal: d => { const g = S.goals.find(x => x.id === d.id); if (g) openGoal(g); },
  saveGoal: d => {

    save(); closeSheet(); rerender(); toast(fresh ? `${name} goal added` : `${name} saved`);
  },

    const g = S.goals.find(x => x.id === d.id); const logs = S.log.filter(e => e.goalId === d.id);

  pickGoalChip: (d, el) => { $('#l-goal').value = d.id; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c===el)); },
  pickAcctChip: (d, el) => { const t = document.getElementById(d.t); if (t) t.value = d.id; el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c===el)); },
  editLog: d => { const e = S.log.find(x => x.id === d.id); if (e) openLog({entry:e}); },
  togglePaid: (d) => {
    const k = d.k, was = S.paid[k];

    if (!was){ const c = document.querySelector(`[data-act="togglePaid"][data-k="${CSS.escape(k)}"]`); c && c.classList.add('pop'); }
    toast(was ? `${name} marked unpaid` : `${name} paid`, () => { if (was) S.paid[k] = was; else delete S.paid[k]; save(); rerender(); });
  },
  quickPay: d => { S.paid[d.k] = {on: today(), amount: r2(d.amt), at: Date.now()}; save(); closeSheet(); rerender(); const name = (S.bills.find(b => b.id === d.k.split('|')[0])||{}).name; toast(`${name} paid`, () => { delete S.paid[d.k]; save(); rerender(); }); },
  pickBucket: d => setBucket(d.k),
  pickDebt: d => { $('#l-debt').value = d.id; document.querySelectorAll('[data-act="pickDebt"]').forEach(c => c.classList.toggle('on', c.dataset.id===d.id)); },
  pickDate: d => setDate(d.d),
  saveLog: () => {
    const editing = openLog.editing;
    const r = parseLog(val('l-text'));
    let amount = parseFloat(String(val('l-amt')).replace(/[$,\s]/g,''));
    if (!editing && r.bill && !r.bnpl && (isNaN(amount) || Math.abs(amount - r.bill.amount) < .01 || /\bpaid|pay\b/i.test(val('l-text')))){
      return act.quickPay({k:r.bill.key, amt: isNaN(amount) ? r.bill.amount : amount});
    }
    if (isNaN(amount) || amount <= 0){ const a = $('#l-amt'); a.focus(); a.parentElement.classList.remove('pop'); void a.offsetWidth; a.parentElement.classList.add('pop'); $('#l-hint').textContent = 'Add an amount, like "12.50".'; return; }
    const bucket = val('l-bucket'), accountId = val('l-acct') || null;
    if (accountId) ui.lastAcct = accountId;
    const sw = $('#l-bnpl');
    if (!editing && sw && sw.classList.contains('on') && ['fun','essential'].includes(bucket)){
      const provider = r.bnpl || openLog.bnplProvider || 'Afterpay';
      const base = r.note || '';
      const name = base ? `${base} (${provider})` : `${provider} purchase`;
      const b = createBnpl({name, total:amount, date:val('l-date'), provider, accountId});
      save(); closeSheet(); rerender();
      return toast(`${provider}: 4 payments of ${money(b.amount)}`, () => { S.bills = S.bills.filter(x => x.id !== b.id); for (const k of Object.keys(S.paid)) if (k.startsWith(b.id+'|')) delete S.paid[k]; save(); rerender(); });
    }
    const note = (editing && val('l-text').trim()===editing.note) ? editing.note : (r.note || val('l-text').trim());
    const debtId = bucket==='debt' ? val('l-debt') || null : null;
    const goalId = bucket==='save' ? val('l-goal') || null : null;
    const toAccountId = goalId ? ((S.goals.find(g=>g.id===goalId)||{}).accountId || null) : null;
    const adjDebt = (id, delta) => { const db = id && S.bills.find(b => b.id === id); if (db && db.balance != null) db.balance = r2(Math.max(0, +db.balance + delta)); };
    if (editing){
      adjDebt(editing.debtId, +editing.amount);
      Object.assign(editing, {amount:r2(amount), bucket, note, date:val('l-date'), debtId, goalId, accountId, toAccountId});
      adjDebt(debtId, -amount);
      save(); closeSheet(); rerender(); toast('Entry updated');
    } else {
      const e = {id:uid(), date:val('l-date'), amount:r2(amount), bucket, note, at:Date.now(), accountId, goalId, toAccountId};
      if (debtId){ e.debtId = debtId; adjDebt(debtId, -amount); }
      S.log.push(e); save(); closeSheet(); rerender();
      toast(`${money(amount)} ${goalId?'added to goal':BUCKET[bucket].label.toLowerCase()+' logged'}`, () => { S.log = S.log.filter(x=>x.id!==e.id); adjDebt(e.debtId, +e.amount); save(); rerender(); });
    }
  },
  delLog: d => {
    const e = S.log.find(x=>x.id===d.id); if (!e) return;
    S.log = S.log.filter(x=>x.id!==d.id);
    const adj = (id, delta) => { const db = id && S.bills.find(b => b.id === id); if (db && db.balance != null) db.balance = r2(Math.max(0, +db.balance + delta)); };
    adj(e.debtId, +e.amount);
    save(); closeSheet(); rerender();
    toast('Entry deleted', () => { S.log.push(e); adj(e.debtId, -e.amount); save(); rerender(); });
  },
  seg: d => { document.getElementById(d.target).value = d.v; document.querySelectorAll(`[data-seg="${d.target}"] button`).forEach(b => b.classList.toggle('on', b.dataset.v===d.v)); if (d.target==='b-type') openBill.sync && openBill.sync(); if (d.target==='a-kind'){ const l = $('#a-ballbl'); if (l) l.textContent = d.v==='credit'?'Amount owed':'Balance'; } },
  switch: (d, el) => { el.classList.toggle('on'); el.setAttribute('aria-checked', el.classList.contains('on')); },
  saveBill: d => {
    const name = val('b-name').trim(), amount = num('b-amt');
    if (!name){ $('#b-name').focus(); return; }
    if (isNaN(amount) || amount < 0){ $('#b-amt').focus(); return; }
    const type = val('b-type');
    let b = S.bills.find(x => x.id === d.id);
    const fresh = !b;
    if (fresh){ b = {id:d.id}; S.bills.push(b); }
    const accEl = document.getElementById('b-acct');
    Object.assign(b, {name, type, autopay: $('#b-auto').classList.contains('on'), accountId: accEl ? accEl.value : (b.accountId||'')});
    if (type === 'bnpl'){
      const cnt = +val('b-cnt') || 4, every = val('b-every'), anchor = val('b-date') || today();
      Object.assign(b, {provider:val('b-prov'), count:cnt, freq:every, anchor, total:r2(amount), amount:r2(amount/cnt)});
      if (every==='monthly') b.dueDay = parse(anchor).getDate(); else delete b.dueDay;
      delete b.since; delete b.balance; delete b.apr;
      if (fresh){ const n = +val('b-paidn') || 0; allBnpl(b).slice(0, n).forEach(dd => { S.paid[b.id+'|'+dd] = {on:dd, amount:b.amount, at:Date.now()}; }); }
    } else {
      const freq = val('b-freq'); b.amount = r2(amount); b.freq = freq;
      delete b.count; delete b.total; delete b.provider;
      if (freq === 'monthly'){ b.dueDay = +val('b-day'); delete b.anchor; } else { b.anchor = val('b-date') || today(); delete b.dueDay; }
      if (type === 'debt'){ const bal = num('b-bal'), apr = parseFloat(val('b-apr')); b.balance = isNaN(bal)?null:r2(bal); b.apr = isNaN(apr)?null:apr; } else { delete b.balance; delete b.apr; }
      if (fresh){
        const t = today(), p = S.settings.payAmount ? periodOf(t) : {start:t};
        b.since = freq==='monthly' ? p.start : (b.anchor < p.start ? p.start : b.anchor);
      }
    }
    save(); closeSheet(); rerender(); toast(fresh ? `${name} added` : `${name} saved`);
  },
  delBill: (d, el) => {
    if (!el.dataset.confirm){ el.dataset.confirm = '1'; el.textContent = 'Tap again to delete'; setTimeout(() => { if (el.isConnected){ delete el.dataset.confirm; el.textContent = 'Delete bill'; } }, 3000); return; }
    const b = S.bills.find(x=>x.id===d.id); const prevPaid = {...S.paid};
    S.bills = S.bills.filter(x => x.id !== d.id);
    for (const k of Object.keys(S.paid)) if (k.startsWith(d.id+'|')) delete S.paid[k];
    save(); closeSheet(); rerender();
    toast(`${b?b.name:'Bill'} deleted`, () => { if (b){ S.bills.push(b); S.paid = prevPaid; save(); rerender(); } });
  },
  saveSettings: () => {
    const s = S.settings, n = id => { const v = num(id); return isNaN(v) ? 0 : r2(v); };
    s.payAmount = n('s-pay'); s.payFreq = val('s-freq'); s.payAnchor = val('s-anchor') || today();
    const pa = document.getElementById('s-acct'); if (pa) s.payAccountId = pa.value || null;
    s.essentials = n('s-ess'); s.buffer = n('s-buf'); s.smooth = $('#s-smooth').classList.contains('on');
    const a = +val('s-debt'), b = +val('s-save'); s.splits = {debt:a, save:b, fun:Math.max(0,100-a-b)};
    ui.periodRef = null; save(); closeSheet(); renderAll(); toast('Paycheque updated');
  },
  preset: d => { const x = PRESETS.find(p=>p.k===d.k); if (!x) return; S.settings.splits = {...x.s}; save(); rerender(); toast(`${x.label}: ${x.s.debt}% debt, ${x.s.save}% savings, ${x.s.fun}% fun`); },
  pPrev: () => { ui.periodRef = prevPeriod(periodOf(ui.periodRef||today())).start; renderPeriod(); },
  pNext: () => { ui.periodRef = nextPeriod(periodOf(ui.periodRef||today())).start; renderPeriod(); },
  pNow: () => { ui.periodRef = null; renderPeriod(); },
  calSel: d => { ui.calSel = d.d; renderCalendar(); },
  calPrev: () => shiftMonth(-1), calNext: () => shiftMonth(1),
  calToday: () => { ui.calMonth = today().slice(0,7); ui.calSel = today(); renderCalendar(); },
  billFilter: d => { ui.billFilter = d.k; renderBills(); },
  addDetected: d => { S.bills.push({id:uid(), name:d.name, amount:r2(d.amt), type:'subscription', freq:'monthly', dueDay:+d.day||1, autopay:true, since:today()}); save(); rerender(); toast(`${d.name} is now tracked`); },
  ask: d => ask(d.q || val('ask-q').trim()),
  import: () => runImport(),
  importAdd: () => {
    if (!importFound) return; let nr = 0, nt = 0;
    const p = S.settings.payAmount ? periodOf(today()) : {start:today()};
    importFound.rec.forEach((r,i) => { const c = document.querySelector(`[data-imp="r${i}"]`); if (!c || !c.checked) return; const freq = FREQ[r.freq] ? r.freq : 'monthly';
      const b = {id:uid(), name:String(r.name).slice(0,60), amount:r2(r.amount), type:['bill','subscription','debt'].includes(r.type)?r.type:'bill', freq, autopay:true, since:p.start};
      if (freq==='monthly') b.dueDay = Math.min(31, Math.max(1, +r.dueDay||1)); else b.anchor = /^\d{4}-\d{2}-\d{2}$/.test(r.anchor||'') ? r.anchor : today();
      S.bills.push(b); nr++; });
    importFound.tx.forEach((t,i) => { const c = document.querySelector(`[data-imp="t${i}"]`); if (!c || !c.checked) return; S.log.push({id:uid(), date:t.date, amount:r2(t.amount), bucket:BUCKET[t.bucket]?t.bucket:'fun', note:String(t.note||'').slice(0,60), at:Date.now()}); nt++; });
    importFound = null; save(); $('#imp-out').innerHTML = ''; $('#imp-text').value = ''; rerender();
    toast(`Added ${nr} bill${nr===1?'':'s'} and ${nt} entr${nt===1?'y':'ies'}`);
  },
  clearExample: () => { S = normalize({settings:{...S.settings, payAmount:0, essentials:0, payAccountId:null}, accounts:[]}); ui.periodRef = null; ui.lastFree = null; save(); renderAll(); openSettings(); },
  resetAll: (d, el) => {
    if (!el.dataset.confirm){ el.dataset.confirm = '1'; el.textContent = 'Tap again to erase all data'; setTimeout(() => { if (el.isConnected){ delete el.dataset.confirm; el.textContent = 'Erase everything'; } }, 3000); return; }
    S = normalize(blank()); ui.lastFree = null; save(); closeSheet(); renderAll(); toast('Everything erased');
  },
  copyData: (d, el) => {
    const txt = JSON.stringify(S, null, 2);
    navigator.clipboard.writeText(txt).then(() => toast('Copied to clipboard')).catch(() => {
      const ta = document.createElement('textarea'); ta.className = 'box'; ta.value = txt; ta.readOnly = true; el.after(ta); ta.select(); toast('Select all and copy');
    });
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (!S && el.dataset.act !== 'tab') return;
  const fn = act[el.dataset.act]; if (!fn) return;
  fn(el.dataset, el);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'ask-q'){ e.preventDefault(); act.ask({}); } });
routeFromHash();
boot();
})();
</script>
